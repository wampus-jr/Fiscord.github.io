<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discord Clone в браузере</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; background-color: #1e1f22; color: white; color-scheme: dark; }
    .custom-scrollbar::-webkit-scrollbar { width: 8px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #2b2d31; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #1a1b1e; border-radius: 4px; }
    .hidden-scrollbar::-webkit-scrollbar { display: none; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.2.0",
      "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
      "lucide-react": "https://esm.sh/lucide-react@0.292.0"
    }
  }
  </script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useRef, createContext, useContext } from 'react';
    import { createRoot } from 'react-dom/client';
    import { 
      X, Settings, LogOut, Send, Hash, Users, Plus, Mic, MicOff, Video, VideoOff, 
      PhoneCall, Image as ImageIcon, Smile, Crown, Check, AlertCircle, ShieldAlert, MonitorUp, Zap, Edit2, Trash2, Ban
    } from 'lucide-react';

    const AppContext = createContext();

    function useMockDB(collectionName) {
      const [data, setData] = useState([]);
      
      useEffect(() => {
        const loadLocal = () => {
          try {
            const stored = localStorage.getItem(`mydiscord_mock_${collectionName}`);
            if (stored) {
              setData(JSON.parse(stored));
            } else {
              if (collectionName === 'users') {
                const defaultUsers = [{ 
                  id: 'user_wampus', username: 'Wampus', password: '123', 
                  avatar: 'https://api.dicebear.com/7.x/identicon/svg?seed=Wampus', banner: '', 
                  pronouns: 'He/Him', customStatus: 'Создатель', avatarDecoration: 'gold',
                  status: 'online', nitroTier: 'ultimate', isPremium: true, 
                  role: 'owner', frexi: 1000000, customTag: '', banned: false, createdAt: Date.now() 
                }];
                setData(defaultUsers);
                localStorage.setItem(`mydiscord_mock_${collectionName}`, JSON.stringify(defaultUsers));
              } else if (collectionName === 'servers') {
                const defaultServers = [{ 
                  id: 'server_global', name: '🌍 Global Chat', type: 'server', 
                  ownerId: 'user_wampus', subscribers: ['user_wampus'], 
                  icon: 'https://api.dicebear.com/7.x/initials/svg?seed=Global', createdAt: Date.now() 
                }];
                setData(defaultServers);
                localStorage.setItem(`mydiscord_mock_${collectionName}`, JSON.stringify(defaultServers));
              } else {
                setData([]);
              }
            }
          } catch (err) {
            setData([]);
          }
        };
        
        loadLocal();
        const handleStorageChange = (e) => {
          if (e.key === `mydiscord_mock_${collectionName}`) loadLocal();
        };
        window.addEventListener('storage', handleStorageChange);
        return () => window.removeEventListener('storage', handleStorageChange);
      }, [collectionName]);

      const addDoc = (docData) => {
        const newDoc = { id: `${collectionName}_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`, ...docData };
        const updatedData = [...data, newDoc];
        setData(updatedData);
        localStorage.setItem(`mydiscord_mock_${collectionName}`, JSON.stringify(updatedData));
        window.dispatchEvent(new StorageEvent('storage', { key: `mydiscord_mock_${collectionName}` }));
        return newDoc;
      };

      const updateDoc = (id, updates) => {
        const updatedData = data.map(doc => doc.id === id ? { ...doc, ...updates } : doc);
        setData(updatedData);
        localStorage.setItem(`mydiscord_mock_${collectionName}`, JSON.stringify(updatedData));
        window.dispatchEvent(new StorageEvent('storage', { key: `mydiscord_mock_${collectionName}` }));
      };
      
      const deleteDoc = (id) => {
        const updatedData = data.filter(doc => doc.id !== id);
        setData(updatedData);
        localStorage.setItem(`mydiscord_mock_${collectionName}`, JSON.stringify(updatedData));
        window.dispatchEvent(new StorageEvent('storage', { key: `mydiscord_mock_${collectionName}` }));
      }

      return { data, addDoc, updateDoc, deleteDoc };
    }

    const ROLE_BADGES = {
      'owner': '👑 Владелец',
      'co-owner': '⭐ Со-Владелец',
      'admin': '🛡️ Админ',
      'moderator': '🔨 Модератор',
      'user': ''
    };

    function App() {
      const [currentUser, setCurrentUser] = useState(null);
      const [authMode, setAuthMode] = useState('login');
      const [usernameInput, setUsernameInput] = useState('');
      const [passwordInput, setPasswordInput] = useState('');
      const [authError, setAuthError] = useState('');

      const { data: users, addDoc: addUser, updateDoc: updateUser, deleteDoc: deleteUser } = useMockDB('users');
      const { data: messages, addDoc: addMessage } = useMockDB('messages');
      const { data: servers, addDoc: addServer, updateDoc: updateServer, deleteDoc: deleteServer } = useMockDB('servers');
      
      const [activeView, setActiveView] = useState('server'); 
      const [activeChat, setActiveChat] = useState('server_global'); 
      const [showSettings, setShowSettings] = useState(false);
      const [showCreateServer, setShowCreateServer] = useState(false);
      const [profileModalUser, setProfileModalUser] = useState(null);

      // WebRTC mock (Fixed for local use)
      const [incomingCall, setIncomingCall] = useState(null);
      const [activeCall, setActiveCall] = useState(null);
      const [localStream, setLocalStream] = useState(null);
      const [remoteStream, setRemoteStream] = useState(null);
      const [isAudioMuted, setIsAudioMuted] = useState(false);
      const [isVideoOff, setIsVideoOff] = useState(false);

      const startCall = async (partnerId, isVideo = true) => {
         try {
           const stream = await navigator.mediaDevices.getUserMedia({ video: isVideo, audio: true });
           setLocalStream(stream);
           setActiveCall({ partnerId, status: 'calling', isVideo });
           setIsAudioMuted(false);
           setIsVideoOff(!isVideo);
           
           // Mocking immediate connection for demo since real WebRTC requires 2 devices/tabs
           setTimeout(() => {
             setActiveCall(curr => (curr && curr.status === 'calling' ? { ...curr, status: 'connected' } : curr));
             setRemoteStream(stream); // Just loopback for visual feedback
           }, 1500);
         } catch (err) {
           console.error("Media error", err);
           alert("Не удалось получить доступ к камере или микрофону.");
         }
      };

      const endCall = () => {
         if (localStream) {
            localStream.getTracks().forEach(t => t.stop());
         }
         setLocalStream(null);
         setRemoteStream(null);
         setActiveCall(null);
         setIncomingCall(null);
      };

      const toggleAudio = () => {
        if (localStream) {
           const track = localStream.getAudioTracks()[0];
           if (track) {
             track.enabled = !track.enabled;
             setIsAudioMuted(!track.enabled);
           }
        }
      };

      const toggleVideo = () => {
        if (localStream) {
           const track = localStream.getVideoTracks()[0];
           if (track) {
             track.enabled = !track.enabled;
             setIsVideoOff(!track.enabled);
           }
        }
      };

      useEffect(() => {
        const savedUid = localStorage.getItem('discord_uid');
        if (savedUid && users.length > 0) {
          const user = users.find(u => u.id === savedUid);
          if (user) {
            if (user.banned) {
               handleLogout();
            } else {
               setCurrentUser(user);
            }
          }
        }
      }, [users]);

      const handleAuthSubmit = (e) => {
        e.preventDefault();
        setAuthError('');
        
        if (authMode === 'login') {
           const foundUser = users.find(u => u.username.toLowerCase() === usernameInput.trim().toLowerCase() && u.password === passwordInput);
           if (foundUser) {
             if (foundUser.banned) {
                setAuthError('Этот аккаунт заблокирован администратором.');
                return;
             }
             localStorage.setItem('discord_uid', foundUser.id);
             setCurrentUser(foundUser);
             setActiveView('server');
             setActiveChat('server_global');
           } else {
             setAuthError('Неверное имя пользователя или пароль.');
           }
        } else {
          if (usernameInput.trim().length < 3) {
            setAuthError('Имя должно быть не менее 3 символов.');
            return;
          }
          const userExists = users.some(u => u.username.toLowerCase() === usernameInput.trim().toLowerCase());
          if (userExists) {
            setAuthError('Имя пользователя уже занято.');
            return;
          }

          // Нитро бесплатно при регистрации, даем 10к фрекси
          const newUserObj = {
            username: usernameInput.trim(),
            password: passwordInput,
            avatar: `https://api.dicebear.com/7.x/identicon/svg?seed=${usernameInput.trim()}`,
            banner: '', pronouns: '', customStatus: '', avatarDecoration: 'none',
            status: 'online', nitroTier: 'ultimate', isPremium: true, role: 'user', frexi: 10000,
            customTag: '', banned: false, createdAt: Date.now()
          };

          const createdUser = addUser(newUserObj);
          
          // Add to global server
          const globalServer = servers.find(s => s.id === 'server_global');
          if (globalServer) {
            updateServer(globalServer.id, { subscribers: [...new Set([...globalServer.subscribers, createdUser.id])] });
          }

          localStorage.setItem('discord_uid', createdUser.id);
          setCurrentUser(createdUser);
          setActiveView('server');
          setActiveChat('server_global');
        }
      };

      const handleLogout = () => {
        localStorage.removeItem('discord_uid');
        setCurrentUser(null);
        setUsernameInput('');
        setPasswordInput('');
      };

      if (!currentUser) {
        return (
          <div className="flex h-screen w-full items-center justify-center bg-[#1e1f22] relative overflow-hidden">
            <div className="z-10 w-full max-w-[480px] p-8 bg-[#313338]/90 backdrop-blur-md text-white rounded-xl shadow-[0_8px_32px_rgba(0,0,0,0.5)] border border-[#3f4147]/50">
              <div className="text-center mb-6">
                <h2 className="text-2xl font-bold mb-1">{authMode === 'login' ? 'С возвращением!' : 'Создать аккаунт'}</h2>
              </div>
              <form onSubmit={handleAuthSubmit} className="space-y-4">
                <div>
                  <label className="block text-xs font-bold text-[#b5bac1] uppercase mb-2">Никнейм</label>
                  <input type="text" value={usernameInput} onChange={(e) => setUsernameInput(e.target.value)} className="w-full p-2.5 bg-[#1e1f22] rounded text-white border border-[#2b2d31]" required />
                </div>
                <div>
                  <label className="block text-xs font-bold text-[#b5bac1] uppercase mb-2">Пароль</label>
                  <input type="password" value={passwordInput} onChange={(e) => setPasswordInput(e.target.value)} className="w-full p-2.5 bg-[#1e1f22] rounded text-white border border-[#2b2d31]" required />
                </div>
                {authError && <div className="text-[#da373c] text-sm font-medium">{authError}</div>}
                <button type="submit" className="w-full bg-[#5865F2] hover:bg-[#4752C4] transition text-white font-medium py-2.5 rounded">{authMode === 'login' ? 'Войти' : 'Зарегистрироваться'}</button>
                <div className="mt-4 text-sm text-[#b5bac1]">
                  <span className="text-[#00a8fc] hover:underline cursor-pointer font-medium" onClick={() => { setAuthMode(authMode === 'login' ? 'register' : 'login'); setAuthError(''); }}>
                    {authMode === 'login' ? 'Регистрация' : 'Вход'}
                  </span>
                </div>
              </form>
            </div>
          </div>
        );
      }

      // Фильтруем сервера: показываем только те, где пользователь участник или владелец
      const myServers = servers.filter(s => (s.subscribers || []).includes(currentUser.id) || s.ownerId === currentUser.id);

      return (
        <AppContext.Provider value={{ 
          currentUser, users, messages, addMessage, updateUser, deleteUser, servers, addServer, updateServer, deleteServer,
          setActiveView, setActiveChat, setShowSettings, activeView, activeChat, setProfileModalUser, ROLE_BADGES,
          activeCall, startCall, endCall, toggleAudio, toggleVideo, localStream, remoteStream, isAudioMuted, isVideoOff
        }}>
          <div className="flex h-screen w-full bg-[#313338] text-white font-sans overflow-hidden">
            
            {/* SERVERS SIDEBAR */}
            <div className="w-[72px] bg-[#1e1f22] flex flex-col items-center py-3 gap-2 overflow-y-auto hidden-scrollbar">
              <div onClick={() => setActiveView('dm')} className={`w-12 h-12 rounded-[24px] hover:rounded-[16px] transition-all duration-300 flex items-center justify-center cursor-pointer ${activeView === 'dm' ? 'bg-[#5865F2] text-white rounded-[16px]' : 'bg-[#313338] text-[#dbdee1] hover:bg-[#5865F2]'}`}>
                 <Users size={24} />
              </div>
              <div className="w-8 h-[2px] bg-[#3f4147] rounded my-1"></div>
              {myServers.map(server => (
                <div key={server.id} onClick={() => { setActiveView('server'); setActiveChat(server.id); }} className={`relative w-12 h-12 rounded-[24px] hover:rounded-[16px] transition-all duration-300 flex items-center justify-center cursor-pointer overflow-hidden ${activeView === 'server' && activeChat === server.id ? 'rounded-[16px] border-2 border-[#5865F2]' : 'bg-[#313338]'}`}>
                  <img src={server.icon} alt={server.name} className="w-full h-full object-cover" />
                </div>
              ))}
              <div onClick={() => setShowCreateServer(true)} className="w-12 h-12 rounded-[24px] hover:rounded-[16px] transition-all duration-300 bg-[#313338] text-[#23a559] hover:bg-[#23a559] hover:text-white flex items-center justify-center cursor-pointer"><Plus size={24} /></div>
            </div>

            {/* CHANNELS / DM SIDEBAR */}
            <div className="w-60 bg-[#2b2d31] flex flex-col justify-between select-none">
              {activeView === 'server' ? (
                <div className="flex-1 flex flex-col">
                  <div className="h-12 border-b border-[#1f2023] flex items-center justify-between px-4 font-bold text-white shadow-sm">
                    <span>{servers.find(s => s.id === activeChat)?.name || 'Сервер'}</span>
                    {(servers.find(s => s.id === activeChat)?.ownerId === currentUser.id || ['owner', 'admin'].includes(currentUser.role)) && (
                       <Settings size={16} className="cursor-pointer hover:text-white text-[#949ba4]" onClick={() => alert('Настройки сервера (В разработке)')} />
                    )}
                  </div>
                  <div className="p-2 space-y-1">
                    <div className="text-xs font-bold text-[#949ba4] px-2 py-1 uppercase">Текстовые каналы</div>
                    <div className="flex items-center gap-2 text-[#dbdee1] bg-[#404249] px-2.5 py-1.5 rounded font-medium text-sm cursor-pointer">
                      <Hash size={18} className="text-[#80848e]" /> общий
                    </div>
                  </div>
                </div>
              ) : (
                <div className="flex-1 flex flex-col overflow-y-auto custom-scrollbar">
                  <div className="px-4 pt-4 pb-1 text-xs font-bold text-[#949ba4] uppercase">Все пользователи (ЛС)</div>
                  <div className="p-2 space-y-0.5">
                    {users.filter(u => u.id !== currentUser.id).map(user => (
                      <div key={user.id} onClick={() => { setActiveView('dm'); setActiveChat(user.id); }} className={`flex items-center justify-between px-2.5 py-2 rounded cursor-pointer group transition ${activeView === 'dm' && activeChat === user.id ? 'bg-[#404249] text-white' : 'text-[#949ba4] hover:bg-[#35373c] hover:text-[#dbdee1]'}`}>
                        <div className="flex items-center gap-3 min-w-0">
                          <div className="relative shrink-0">
                            <img src={user.avatar} className="w-8 h-8 rounded-full object-cover" />
                            <div className={`absolute bottom-0 right-0 w-2.5 h-2.5 rounded-full border-2 border-[#2b2d31] ${user.status === 'online' ? 'bg-[#23a559]' : 'bg-[#80848e]'}`}></div>
                          </div>
                          <div className="flex flex-col min-w-0">
                            <span className="font-medium text-sm text-white truncate flex items-center gap-1">
                              {user.customTag ? `[${user.customTag}] ${user.username}` : user.username}
                              {user.isPremium && <Zap size={13} className="text-[#00a8fc] fill-[#00a8fc] shrink-0" />}
                            </span>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}
              {/* USER PROFILE BAR */}
              <div className="h-14 bg-[#232428] px-2 flex items-center justify-between border-t border-[#1f2023]">
                <div onClick={() => setShowSettings(true)} className="flex items-center gap-2 p-1.5 rounded-md hover:bg-[#35373c] cursor-pointer flex-1 min-w-0 mr-1 transition">
                  <div className="relative shrink-0">
                    <img src={currentUser.avatar} className="w-8 h-8 rounded-full object-cover" />
                    <div className="absolute bottom-0 right-0 w-2.5 h-2.5 rounded-full border-2 border-[#232428] bg-[#23a559]"></div>
                  </div>
                  <div className="flex flex-col min-w-0">
                    <span className="font-semibold text-sm text-white truncate flex items-center gap-1">
                      {currentUser.username} {ROLE_BADGES[currentUser.role]}
                    </span>
                    <span className="text-[11px] text-[#949ba4] truncate">{currentUser.frexi} Frexi</span>
                  </div>
                </div>
                <button onClick={() => setShowSettings(true)} className="p-1.5 text-[#b5bac1] hover:bg-[#35373c] hover:text-white rounded transition"><Settings size={18} /></button>
              </div>
            </div>

            {/* MAIN CONTENT AREA */}
            <div className="flex-1 flex flex-col min-w-0 bg-[#313338] relative">
              {activeView === 'dm' && activeChat && <DMView />}
              {activeView === 'server' && activeChat && <ServerView />}
            </div>
          </div>

          {showCreateServer && <CreateServerModal onClose={() => setShowCreateServer(false)} />}
          {showSettings && <SettingsModal onClose={() => setShowSettings(false)} onLogout={handleLogout} />}
          {profileModalUser && <ProfileModal user={profileModalUser} onClose={() => setProfileModalUser(null)} />}
        </AppContext.Provider>
      );
    }

    // ---------------- DM VIEW (MESSAGES & CALLS) ----------------
    function DMView() {
      const { currentUser, users, activeChat, messages, addMessage, activeCall, startCall, endCall, toggleAudio, toggleVideo, localStream, remoteStream, isAudioMuted, isVideoOff, setProfileModalUser } = useContext(AppContext);
      const friend = users.find(u => u.id === activeChat);
      const [msgInput, setMsgInput] = useState('');
      const chatEndRef = useRef(null);

      useEffect(() => { chatEndRef.current?.scrollIntoView(); }, [messages, activeChat]);
      if (!friend) return <div className="flex-1 flex items-center justify-center text-[#949ba4]">Выберите пользователя для начала общения</div>;

      const chatMessages = messages.filter(m => (m.senderId === currentUser.id && m.receiverId === friend.id) || (m.senderId === friend.id && m.receiverId === currentUser.id)).sort((a, b) => a.createdAt - b.createdAt);

      const handleSend = (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          if (!msgInput.trim()) return;
          addMessage({ senderId: currentUser.id, receiverId: friend.id, text: msgInput.trim(), createdAt: Date.now() });
          setMsgInput('');
        }
      };

      return (
        <div className="flex flex-col h-full bg-[#313338]">
          <div className="h-12 border-b border-[#1f2023] flex items-center justify-between px-4 shadow-sm shrink-0">
            <div className="flex items-center gap-3 cursor-pointer" onClick={() => setProfileModalUser(friend)}>
               <span className="font-semibold text-white flex items-center gap-2">
                 {friend.customTag ? `[${friend.customTag}] ` : ''} {friend.username} {friend.isPremium && <Zap size={16} className="text-[#00a8fc] fill-[#00a8fc]" />}
               </span>
               <div className={`w-2.5 h-2.5 rounded-full ${friend.status === 'online' ? 'bg-[#23a559]' : 'bg-[#80848e]'}`}></div>
            </div>
            <div className="flex items-center gap-4 text-[#b5bac1]">
              <button onClick={() => startCall(friend.id, false)} className="hover:text-[#dbdee1]"><PhoneCall size={20} /></button>
              <button onClick={() => startCall(friend.id, true)} className="hover:text-[#dbdee1]"><Video size={20} /></button>
            </div>
          </div>

          {activeCall && activeCall.partnerId === friend.id ? (
            <div className="flex-1 bg-[#1e1f22] flex flex-col relative p-4">
               <div className="flex-1 flex gap-4 mb-20">
                  <div className="flex-1 rounded-xl bg-black relative border-2 border-[#2b2d31] overflow-hidden">
                     {localStream && <video autoPlay playsInline muted className="w-full h-full object-cover scale-x-[-1]" ref={v => { if(v) v.srcObject = localStream }} />}
                     <div className="absolute bottom-4 left-4 bg-black/70 px-3 py-1.5 rounded-md text-sm font-semibold flex items-center gap-2">Вы {isAudioMuted && <MicOff size={14} className="text-[#da373c]" />}</div>
                  </div>
                  <div className="flex-1 rounded-xl bg-black relative border-2 border-[#2b2d31] overflow-hidden flex items-center justify-center">
                     {remoteStream ? (
                         <video autoPlay playsInline className="w-full h-full object-cover" ref={v => { if(v) v.srcObject = remoteStream }} />
                     ) : (
                         <div className="w-full h-full flex flex-col items-center justify-center text-white gap-4 bg-[#111214]">
                            <img src={friend.avatar} className="w-24 h-24 rounded-full animate-pulse object-cover border-4 border-[#2b2d31]" />
                            <div className="font-medium text-lg text-[#b5bac1]">{activeCall.status === 'calling' ? `Звонок ${friend.username}...` : 'Подключение...'}</div>
                         </div>
                     )}
                     <div className="absolute bottom-4 left-4 bg-black/70 px-3 py-1.5 rounded-md text-sm font-semibold">{friend.username}</div>
                  </div>
               </div>
               <div className="absolute bottom-6 left-1/2 -translate-x-1/2 flex gap-4 bg-[#2b2d31] p-2.5 rounded-2xl shadow-xl">
                 <button onClick={toggleVideo} className={`w-14 h-14 rounded-full flex items-center justify-center text-white transition ${isVideoOff ? 'bg-[#da373c]' : 'bg-[#313338] hover:bg-[#3f4147]'}`}>{isVideoOff ? <VideoOff size={24}/> : <Video size={24}/>}</button>
                 <button onClick={toggleAudio} className={`w-14 h-14 rounded-full flex items-center justify-center text-white transition ${isAudioMuted ? 'bg-[#da373c]' : 'bg-[#313338] hover:bg-[#3f4147]'}`}>{isAudioMuted ? <MicOff size={24}/> : <Mic size={24}/>}</button>
                 <button onClick={() => endCall()} className="w-14 h-14 bg-[#da373c] hover:bg-[#c92b30] rounded-full flex items-center justify-center text-white transition"><PhoneCall size={24} className="rotate-[135deg]"/></button>
               </div>
            </div>
          ) : (
            <>
              <div className="flex-1 overflow-y-auto px-4 py-6 space-y-4 custom-scrollbar">
                <div className="flex flex-col justify-end min-h-full">
                  <div className="mb-8">
                    <img src={friend.avatar} className="w-20 h-20 rounded-full mb-4 object-cover" />
                    <h1 className="text-3xl font-bold text-white mb-2">{friend.username}</h1>
                    <p className="text-[#b5bac1]">Это начало вашей истории сообщений.</p>
                  </div>
                  {chatMessages.map((msg, i) => {
                    const isMine = msg.senderId === currentUser.id;
                    const sender = isMine ? currentUser : friend;
                    const showHeader = i === 0 || chatMessages[i - 1].senderId !== msg.senderId;
                    return (
                      <div key={msg.id} className={`flex gap-4 hover:bg-[#2e3035] p-0.5 -mx-4 px-4 rounded ${!showHeader ? 'mt-0' : 'mt-4'}`}>
                        {showHeader ? <img src={sender.avatar} className="w-10 h-10 rounded-full cursor-pointer object-cover" onClick={() => setProfileModalUser(sender)} /> : <div className="w-10 flex-shrink-0"></div>}
                        <div className="flex flex-col min-w-0">
                          {showHeader && (
                            <div className="flex items-baseline gap-2">
                              <span className="text-white font-medium hover:underline cursor-pointer flex items-center gap-1" onClick={() => setProfileModalUser(sender)}>
                                {sender.customTag ? `[${sender.customTag}] ` : ''} {sender.username}
                              </span>
                            </div>
                          )}
                          <span className="text-[#dbdee1] whitespace-pre-wrap break-words">{msg.text}</span>
                        </div>
                      </div>
                    );
                  })}
                  <div ref={chatEndRef} />
                </div>
              </div>
              <div className="px-4 pb-6 pt-2 shrink-0">
                <div className="bg-[#383a40] rounded-lg flex items-center px-4 py-2.5">
                  <input type="text" placeholder={`Написать @${friend.username}`} className="flex-1 bg-transparent text-[#dbdee1] outline-none" value={msgInput} onChange={(e) => setMsgInput(e.target.value)} onKeyDown={handleSend} />
                </div>
              </div>
            </>
          )}
        </div>
      );
    }

    // ---------------- SERVER VIEW ----------------
    function ServerView() {
      const { currentUser, users, servers, activeChat, messages, addMessage, setProfileModalUser, updateServer } = useContext(AppContext);
      const server = servers.find(s => s.id === activeChat);
      const [msgInput, setMsgInput] = useState('');
      const chatEndRef = useRef(null);

      useEffect(() => { chatEndRef.current?.scrollIntoView(); }, [messages, activeChat]);
      if (!server) return null;

      const chatMessages = messages.filter(m => m.serverId === server.id).sort((a, b) => a.createdAt - b.createdAt);
      const isSubscribed = (server.subscribers || []).includes(currentUser.id);

      const handleSend = (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          if (!msgInput.trim()) return;
          addMessage({ serverId: server.id, senderId: currentUser.id, text: msgInput.trim(), createdAt: Date.now() });
          setMsgInput('');
        }
      };

      const joinServer = () => {
         updateServer(server.id, { subscribers: [...(server.subscribers || []), currentUser.id] });
      }

      return (
        <div className="flex flex-col h-full bg-[#313338]">
          <div className="h-12 border-b border-[#1f2023] flex items-center justify-between px-4 shadow-sm shrink-0">
            <div className="flex items-center gap-2"><Hash size={24} className="text-[#80848e]" /><span className="font-semibold text-white">{server.name}</span></div>
          </div>
          <div className="flex-1 overflow-y-auto px-4 py-6 space-y-4 custom-scrollbar">
            <div className="flex flex-col justify-end min-h-full">
              <div className="mb-8">
                <h1 className="text-3xl font-bold text-white mb-2">Добро пожаловать в {server.name}!</h1>
              </div>
              {chatMessages.map((msg, i) => {
                const sender = users.find(u => u.id === msg.senderId) || { username: 'Неизвестный', avatar: '' };
                const showHeader = i === 0 || chatMessages[i - 1].senderId !== msg.senderId;
                return (
                  <div key={msg.id} className={`flex gap-4 hover:bg-[#2e3035] p-2 -mx-4 px-4 rounded ${!showHeader ? 'mt-0' : 'mt-4'}`}>
                    {showHeader ? <img src={sender.avatar} className="w-10 h-10 rounded-full cursor-pointer object-cover" onClick={() => setProfileModalUser(sender)} /> : <div className="w-10"></div>}
                    <div className="flex flex-col min-w-0 flex-1">
                      {showHeader && (
                        <div className="flex items-baseline gap-2">
                          <span className="text-white font-medium hover:underline cursor-pointer flex items-center gap-1" onClick={() => setProfileModalUser(sender)}>
                             {sender.customTag ? `[${sender.customTag}] ` : ''} {sender.username}
                          </span>
                        </div>
                      )}
                      <span className="text-[#dbdee1] whitespace-pre-wrap break-words mt-1">{msg.text}</span>
                    </div>
                  </div>
                );
              })}
              <div ref={chatEndRef} />
            </div>
          </div>
          <div className="px-4 pb-6 pt-2 shrink-0">
             {!isSubscribed && server.id !== 'server_global' ? (
                <button onClick={joinServer} className="w-full bg-[#23a559] hover:bg-[#1f914d] text-white py-2 rounded">Присоединиться к серверу</button>
             ) : (
                <div className="bg-[#383a40] rounded-lg flex items-center px-4 py-2.5">
                  <input type="text" placeholder={`Написать в #общий`} className="flex-1 bg-transparent text-[#dbdee1] outline-none" value={msgInput} onChange={(e) => setMsgInput(e.target.value)} onKeyDown={handleSend} />
                </div>
             )}
          </div>
        </div>
      );
    }

    // ---------------- PROFILE MODAL ----------------
    function ProfileModal({ user, onClose }) {
       const { ROLE_BADGES } = useContext(AppContext);
       const bannerStyle = user.banner ? { backgroundImage: `url(${user.banner})`, backgroundSize: 'cover' } : { backgroundColor: user.profileColor || '#5865F2' };
       return (
          <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/70 animate-in fade-in" onClick={onClose}>
             <div className="bg-[#111214] w-80 rounded-2xl overflow-hidden shadow-2xl relative border border-[#1e1f22]" onClick={e => e.stopPropagation()}>
               <button onClick={onClose} className="absolute top-2 right-2 p-1 bg-black/50 rounded-full text-white z-10 hover:bg-black"><X size={16}/></button>
               <div className="h-[120px]" style={bannerStyle}></div>
               <div className="absolute top-[75px] left-4 p-1.5 bg-[#111214] rounded-full">
                 <img src={user.avatar} className="w-20 h-20 rounded-full object-cover" />
               </div>
               <div className="p-4 pt-14 bg-[#111214]">
                 <div className="bg-[#2b2d31] rounded-xl p-3 shadow-inner">
                   <div className="font-bold text-white text-lg leading-tight mb-1 flex flex-col">
                     <span>{user.customTag ? `[${user.customTag}] ` : ''}{user.username} {user.isPremium && <Zap size={14} className="inline text-[#00a8fc] fill-[#00a8fc]"/>}</span>
                     <span className="text-sm text-[#23a559] mt-1">{ROLE_BADGES[user.role]}</span>
                   </div>
                   {user.customStatus && <div className="text-sm text-[#dbdee1] mb-2">{user.customStatus}</div>}
                   <div className="w-full h-[1px] bg-[#3f4147] mb-2"></div>
                   <div className="text-xs font-bold text-[#b5bac1] uppercase mb-1">Обо мне</div>
                   <div className="text-sm text-[#dbdee1] whitespace-pre-wrap">{user.bio || "Пользователь не добавил описание."}</div>
                 </div>
               </div>
             </div>
          </div>
       );
    }

    // ---------------- CREATE SERVER MODAL ----------------
    function CreateServerModal({ onClose }) {
      const { currentUser, addServer, setActiveView, setActiveChat } = useContext(AppContext);
      const [name, setName] = useState(`${currentUser.username}'s Server`);
      const handleSubmit = (e) => {
        e.preventDefault();
        const newServer = addServer({ name, type: 'server', ownerId: currentUser.id, subscribers: [currentUser.id], icon: `https://api.dicebear.com/7.x/initials/svg?seed=${name}`, createdAt: Date.now() });
        setActiveView('server'); setActiveChat(newServer.id); onClose();
      };
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50">
          <div className="bg-[#313338] text-white w-full max-w-md rounded-xl p-6">
            <h2 className="text-2xl font-bold mb-4">Создать сервер</h2>
            <form onSubmit={handleSubmit}>
              <input type="text" value={name} onChange={e => setName(e.target.value)} className="w-full bg-[#1e1f22] p-2.5 rounded mb-4" required />
              <div className="flex justify-end gap-2"><button type="button" onClick={onClose} className="px-4 py-2">Отмена</button><button type="submit" className="bg-[#5865F2] px-4 py-2 rounded">Создать</button></div>
            </form>
          </div>
        </div>
      );
    }

    // ---------------- SETTINGS MODAL ----------------
    function SettingsModal({ onClose, onLogout }) {
      const { currentUser, updateUser, users, deleteUser, ROLE_BADGES } = useContext(AppContext);
      const [activeTab, setActiveTab] = useState('profile');
      const isAdmin = ['admin', 'owner', 'co-owner'].includes(currentUser.role);

      return (
        <div className="fixed inset-0 z-50 flex bg-[#313338] text-white">
          <div className="w-[30%] bg-[#2b2d31] flex flex-col items-end py-14 px-4 overflow-y-auto custom-scrollbar">
            <div className="w-48 flex flex-col gap-1.5">
              <div className="text-xs font-bold text-[#b5bac1] px-2.5 pb-1 uppercase">Настройки пользователя</div>
              <button onClick={() => setActiveTab('profile')} className={`text-left px-2.5 py-1.5 rounded ${activeTab==='profile'?'bg-[#404249]':'hover:bg-[#35373c]'}`}>Профиль и Безопасность</button>
              <button onClick={() => setActiveTab('customization')} className={`text-left px-2.5 py-1.5 rounded ${activeTab==='customization'?'bg-[#404249]':'hover:bg-[#35373c]'}`}>Настройка профиля (Файлы)</button>
              <button onClick={() => setActiveTab('store')} className={`text-left px-2.5 py-1.5 rounded ${activeTab==='store'?'bg-[#404249]':'hover:bg-[#35373c]'}`}>Магазин (Теги)</button>
              
              {isAdmin && (
                 <>
                   <div className="h-[1px] bg-[#3f4147] my-2 mx-2"></div>
                   <div className="text-xs font-bold text-[#da373c] px-2.5 pb-1 uppercase">Админ Панель</div>
                   <button onClick={() => setActiveTab('admin')} className={`text-left px-2.5 py-1.5 rounded text-[#da373c] ${activeTab==='admin'?'bg-[#da373c]/20':'hover:bg-[#da373c]/10'}`}>Управление</button>
                 </>
              )}
              <div className="h-[1px] bg-[#3f4147] my-2 mx-2"></div>
              <button onClick={onLogout} className="text-left px-2.5 py-1.5 rounded text-[#da373c] hover:bg-[#da373c]/10">Выйти</button>
            </div>
          </div>

          <div className="flex-1 bg-[#313338] py-14 px-10 relative overflow-y-auto custom-scrollbar">
            <button onClick={onClose} className="absolute top-14 right-10 flex flex-col items-center text-[#b5bac1]"><X size={36}/><span className="text-xs">ESC</span></button>
            <div className="max-w-[740px]">
              {activeTab === 'profile' && <MyAccountTab currentUser={currentUser} updateUser={updateUser} />}
              {activeTab === 'customization' && <ProfilesTab currentUser={currentUser} updateUser={updateUser} />}
              {activeTab === 'store' && <StoreTab currentUser={currentUser} updateUser={updateUser} />}
              {activeTab === 'admin' && isAdmin && <AdminTab currentUser={currentUser} users={users} updateUser={updateUser} deleteUser={deleteUser} ROLE_BADGES={ROLE_BADGES} />}
            </div>
          </div>
        </div>
      );
    }

    function MyAccountTab({ currentUser, updateUser }) {
       const [newPwd, setNewPwd] = useState('');
       const handleChangePwd = (e) => {
          e.preventDefault();
          updateUser(currentUser.id, { password: newPwd });
          alert('Пароль успешно изменен!');
          setNewPwd('');
       };
       return (
          <div>
            <h2 className="text-xl font-bold mb-6 text-white">Мой аккаунт</h2>
            <div className="bg-[#2b2d31] p-4 rounded-xl mb-6">
              <div className="mb-2"><span className="text-[#b5bac1] uppercase text-xs font-bold">Никнейм:</span> <span className="font-bold">{currentUser.username}</span></div>
              <div className="mb-2"><span className="text-[#b5bac1] uppercase text-xs font-bold">Баланс:</span> <span className="font-bold text-[#23a559]">{currentUser.frexi} Frexi</span></div>
              <div><span className="text-[#b5bac1] uppercase text-xs font-bold">Роль:</span> <span className="font-bold">{currentUser.role}</span></div>
            </div>
            <h3 className="text-lg font-bold mb-4">Смена пароля</h3>
            <form onSubmit={handleChangePwd} className="flex gap-4">
              <input type="text" placeholder="Новый пароль" value={newPwd} onChange={e=>setNewPwd(e.target.value)} className="bg-[#1e1f22] p-2 rounded text-white flex-1" required/>
              <button type="submit" className="bg-[#5865F2] px-4 rounded text-white font-medium">Сменить</button>
            </form>
          </div>
       );
    }

    function ProfilesTab({ currentUser, updateUser }) {
      const [avatar, setAvatar] = useState(currentUser.avatar || '');
      const [banner, setBanner] = useState(currentUser.banner || '');
      const [bio, setBio] = useState(currentUser.bio || '');

      const handleFile = (e, setter) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => setter(event.target.result);
        reader.readAsDataURL(file);
      };

      const save = () => {
         updateUser(currentUser.id, { avatar, banner, bio });
         alert("Сохранено!");
      }

      // Preset Gifs for avatar
      const presetAvatars = [
         "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExcDdvN2V6Z3U4bGQ5c2JkMnF2bThoMWJ3cDFtd29ndmZ6cWwyNXZoYiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/LqO7F6DXXJ7u0/giphy.gif",
         "https://media.giphy.com/media/ZcVvKqM3UvYI5r4cE2/giphy.gif"
      ];

      return (
        <div className="pb-20">
          <h2 className="text-xl font-bold mb-6 text-white">Настройка профиля</h2>
          <div className="space-y-6">
            <div>
              <h3 className="text-xs font-bold text-[#b5bac1] uppercase mb-2">Аватар (Загрузить файл)</h3>
              <input type="file" accept="image/*" onChange={(e) => handleFile(e, setAvatar)} className="mb-4 block" />
              <div className="flex gap-2">
                 {presetAvatars.map(url => <img key={url} src={url} className="w-12 h-12 rounded cursor-pointer border hover:border-[#00a8fc]" onClick={()=>setAvatar(url)}/>)}
              </div>
            </div>
            <div>
              <h3 className="text-xs font-bold text-[#b5bac1] uppercase mb-2">Баннер (Загрузить файл)</h3>
              <input type="file" accept="image/*" onChange={(e) => handleFile(e, setBanner)} className="block" />
            </div>
            <div>
              <h3 className="text-xs font-bold text-[#b5bac1] uppercase mb-2">Обо мне</h3>
              <textarea value={bio} onChange={e=>setBio(e.target.value)} className="w-full bg-[#1e1f22] p-3 rounded h-24" />
            </div>
            <button onClick={save} className="bg-[#248046] text-white px-6 py-2 rounded">Сохранить изменения</button>
          </div>
        </div>
      );
    }

    function StoreTab({ currentUser, updateUser }) {
       const [tagInput, setTagInput] = useState('');
       const [error, setError] = useState('');

       const buyTag = () => {
          setError('');
          const cost = 5000;
          if (currentUser.frexi < cost) { setError('Недостаточно Frexi (нужно 5000)'); return; }
          const forbidden = ['admin', 'moderator', 'owner', 'админ', 'модератор', 'владелец', 'поддержка', 'support'];
          if (forbidden.some(word => tagInput.toLowerCase().includes(word))) {
             setError('Этот тег запрещен (содержит слова админ, модератор и т.д.)'); return;
          }
          updateUser(currentUser.id, { customTag: tagInput.trim(), frexi: currentUser.frexi - cost });
          alert('Тег успешно куплен и установлен!');
       };

       return (
          <div>
            <h2 className="text-xl font-bold mb-6 text-white">Магазин</h2>
            <div className="bg-[#2b2d31] p-6 rounded-xl border border-[#3f4147]">
               <h3 className="font-bold text-lg mb-2">Купить кастомный тег</h3>
               <p className="text-[#b5bac1] text-sm mb-4">Установите уникальный тег перед никнеймом. Стоимость: 5000 Frexi.</p>
               <div className="flex gap-4">
                  <input type="text" placeholder="Ваш тег (без скобок)" value={tagInput} onChange={e=>setTagInput(e.target.value)} className="bg-[#1e1f22] p-2.5 rounded flex-1" />
                  <button onClick={buyTag} className="bg-[#00a8fc] hover:bg-[#0090d8] px-4 py-2 rounded font-bold">Купить</button>
               </div>
               {error && <div className="text-[#da373c] mt-2 text-sm">{error}</div>}
            </div>
          </div>
       );
    }

    function AdminTab({ currentUser, users, updateUser, deleteUser, ROLE_BADGES }) {
       const [targetUser, setTargetUser] = useState(null);
       const [roleSelect, setRoleSelect] = useState('user');

       const handleAction = (userId, action, payload=null) => {
          if (action === 'ban') updateUser(userId, { banned: true });
          if (action === 'unban') updateUser(userId, { banned: false });
          if (action === 'delete') {
             if(confirm('Точно удалить?')) deleteUser(userId);
          }
          if (action === 'role') updateUser(userId, { role: payload });
          if (action === 'gift') {
             const user = users.find(u=>u.id === userId);
             updateUser(userId, { frexi: (user.frexi || 0) + 10000 });
             alert('Подарено 10000 Frexi');
          }
       };

       // Security: Only high roles can see this
       if (!['admin', 'owner', 'co-owner'].includes(currentUser.role)) return <div>Нет доступа</div>;

       return (
          <div>
             <h2 className="text-xl font-bold mb-6 text-[#da373c] flex items-center gap-2"><ShieldAlert /> Админ Панель</h2>
             <div className="space-y-4">
               {users.map(u => (
                  <div key={u.id} className="bg-[#2b2d31] p-4 rounded-xl flex items-center justify-between border border-[#3f4147]">
                     <div className="flex items-center gap-3">
                        <img src={u.avatar} className="w-10 h-10 rounded-full" />
                        <div>
                           <div className="font-bold flex items-center gap-2">{u.username} {u.banned && <span className="text-xs bg-[#da373c] px-1 rounded">BANNED</span>}</div>
                           <div className="text-xs text-[#b5bac1]">Роль: {u.role} | Frexi: {u.frexi}</div>
                        </div>
                     </div>
                     <div className="flex gap-2 items-center">
                        <select className="bg-[#1e1f22] p-1 rounded text-xs" value={u.role} onChange={(e) => handleAction(u.id, 'role', e.target.value)}>
                           <option value="user">Пользователь</option>
                           <option value="moderator">Модератор</option>
                           <option value="admin">Админ</option>
                           {['owner', 'co-owner'].includes(currentUser.role) && <option value="co-owner">Со-Владелец</option>}
                           {currentUser.role === 'owner' && <option value="owner">Владелец</option>}
                        </select>
                        <button onClick={() => handleAction(u.id, 'gift')} className="bg-[#00a8fc] p-1.5 rounded text-white" title="Подарить 10к Frexi"><Zap size={16}/></button>
                        {u.banned ? 
                           <button onClick={() => handleAction(u.id, 'unban')} className="bg-[#23a559] p-1.5 rounded text-white text-xs font-bold">Разбан</button> :
                           <button onClick={() => handleAction(u.id, 'ban')} className="bg-[#da373c] p-1.5 rounded text-white" title="Забанить"><Ban size={16}/></button>
                        }
                        <button onClick={() => handleAction(u.id, 'delete')} className="bg-black p-1.5 rounded text-[#da373c]" title="Удалить аккаунт"><Trash2 size={16}/></button>
                     </div>
                  </div>
               ))}
             </div>
          </div>
       );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
