    function NitroTab() {
      const { currentUser, updateUser } = useContext(AppContext);
      const [promoCode, setPromoCode] = useState('');
      const [promoStatus, setPromoStatus] = useState(null);

      const handleRedeem = (e) => {
        e.preventDefault();
        const code = promoCode.trim().toUpperCase();
        
        // Check local storage for generated promo codes by Admin
        let validCodes = {};
        try {
           validCodes = JSON.parse(localStorage.getItem('mydiscord_promos')) || {};
        } catch (e) {}

        if (validCodes[code]) {
          const tier = validCodes[code];
          updateUser(currentUser.id, { nitroTier: tier, isPremium: true });
          delete validCodes[code];
          localStorage.setItem('mydiscord_promos', JSON.stringify(validCodes));
          setPromoStatus({ type: 'success', text: `Success! You unlocked Nitro ${tier.charAt(0).toUpperCase() + tier.slice(1)}.` });
        } else {
          setPromoStatus({ type: 'error', text: "Unknown or expired gift code." });
        }
      };

      return (
        <div>
          <h2 className="text-xl font-bold mb-6 text-white flex items-center gap-2">
            <Zap className="text-[#00a8fc] fill-[#00a8fc]" size={28} /> Nitro Settings
          </h2>

          {currentUser.isPremium ? (
            <div className="bg-gradient-to-r from-[#00a8fc]/20 to-[#5865F2]/20 border border-[#00a8fc]/50 p-6 rounded-xl mb-8 flex items-center justify-between">
               <div>
                 <h3 className="text-xl font-bold text-white mb-2">You are subscribed to Nitro {currentUser.nitroTier.charAt(0).toUpperCase() + currentUser.nitroTier.slice(1)}!</h3>
                 <p className="text-[#b5bac1]">Thank you for supporting MyDiscord. Enjoy your enhanced limits and shiny badge.</p>
               </div>
               <Zap size={64} className="text-[#00a8fc] fill-[#00a8fc] opacity-80 drop-shadow-[0_0_15px_rgba(0,168,252,0.8)]" />
            </div>
          ) : (
            <div className="bg-[#2b2d31] p-6 rounded-xl mb-8 text-center">
               <Zap size={48} className="mx-auto text-[#00a8fc] fill-[#00a8fc] mb-4" />
               <h3 className="text-xl font-bold text-white mb-2">Unlock MyDiscord Nitro</h3>
               <p className="text-[#b5bac1]">Get custom banners, higher upload limits, and a special badge. Redeem a code below.</p>
            </div>
          )}

          <div className="mb-8">
            <h3 className="text-sm font-bold text-[#b5bac1] uppercase mb-2">Redeem Codes</h3>
            <form onSubmit={handleRedeem} className="flex gap-4">
              <input 
                type="text" 
                placeholder="Enter promo code (e.g. ULTIMATE-XXXX)"
                value={promoCode}
                onChange={(e) => setPromoCode(e.target.value)}
                className="flex-1 bg-[#1e1f22] p-2.5 rounded text-white focus:outline-none focus:ring-2 focus:ring-[#00a8fc]"
              />
              <button type="submit" className="bg-[#5865F2] hover:bg-[#4752C4] text-white px-6 py-2.5 rounded font-medium transition">
                Redeem
              </button>
            </form>
            {promoStatus && (
              <div className={`mt-2 text-sm font-medium ${promoStatus.type === 'error' ? 'text-[#da373c]' : 'text-[#23a559]'}`}>
                {promoStatus.text}
              </div>
            )}
          </div>

          <div className="grid grid-cols-3 gap-4">
             <TierCard name="Boost" upload="50MB" features={["Custom Avatar", "Nitro Badge"]} />
             <TierCard name="Ultra" upload="100MB" features={["Custom Profile Banner", "Animated Avatar", "Nitro Badge"]} highlighted />
             <TierCard name="Ultimate" upload="500MB" features={["All Ultra Features", "Custom Profile Colors", "Priority Server Voice"]} />
          </div>
        </div>
      );
    }

    function TierCard({ name, upload, features, highlighted }) {
      return (
        <div className={`p-4 rounded-xl border flex flex-col h-full ${highlighted ? 'border-[#00a8fc] bg-[#00a8fc]/10' : 'border-[#3f4147] bg-[#2b2d31]'}`}>
           <h4 className="text-lg font-bold text-white mb-1">{name}</h4>
           <div className="text-xs text-[#b5bac1] mb-4">Max Upload: <span className="font-bold text-white">{upload}</span></div>
           <ul className="space-y-2 flex-1 mb-4">
             {features.map((f, i) => (
               <li key={i} className="flex items-start gap-2 text-sm text-[#dbdee1]">
                 <Check size={16} className="text-[#23a559] mt-0.5 shrink-0" />
                 {f}
               </li>
             ))}
           </ul>
        </div>
      );
    }

    function AdminTab() {
      const [codes, setCodes] = useState({});
      const [generatedCode, setGeneratedCode] = useState('');
      const [customCodeInput, setCustomCodeInput] = useState('');
      const [customTierSelect, setCustomTierSelect] = useState('boost');
      
      useEffect(() => {
        try {
           setCodes(JSON.parse(localStorage.getItem('mydiscord_promos')) || {});
        } catch (e) {}
      }, []);

      const saveCode = (code, tier) => {
        const newCodes = { ...codes, [code]: tier };
        setCodes(newCodes);
        setGeneratedCode(code);
        localStorage.setItem('mydiscord_promos', JSON.stringify(newCodes));
      };

      const generateCode = (tier) => {
        const code = `${tier.toUpperCase()}-${Math.random().toString(36).substr(2, 6).toUpperCase()}`;
        saveCode(code, tier);
      };

      const handleCustomCode = (e) => {
        e.preventDefault();
        if (!customCodeInput.trim()) return;
        const code = customCodeInput.trim().toUpperCase().replace(/\s+/g, '-');
        saveCode(code, customTierSelect);
        setCustomCodeInput('');
      };

      const clearCodes = () => {
        setCodes({});
        setGeneratedCode('');
        localStorage.removeItem('mydiscord_promos');
      };

      return (
        <div>
          <h2 className="text-xl font-bold mb-6 text-[#da373c] flex items-center gap-2">
            <ShieldAlert size={28} /> Wampus Admin Panel
          </h2>
          <p className="text-[#b5bac1] mb-6">Welcome, Staff. Generate Nitro promo codes to give away to users.</p>

          <div className="flex gap-4 mb-4">
            <button onClick={() => generateCode('boost')} className="bg-[#5865F2] hover:bg-[#4752C4] text-white px-4 py-2 rounded font-medium text-sm transition">Random Boost</button>
            <button onClick={() => generateCode('ultra')} className="bg-[#00a8fc] hover:bg-[#0090d8] text-white px-4 py-2 rounded font-medium text-sm transition">Random Ultra</button>
            <button onClick={() => generateCode('ultimate')} className="bg-[#da373c] hover:bg-[#c92b30] text-white px-4 py-2 rounded font-medium text-sm transition">Random Ultimate</button>
          </div>

          <form onSubmit={handleCustomCode} className="flex gap-4 mb-6 bg-[#2b2d31] p-4 rounded-xl items-end border border-[#3f4147]">
            <div className="flex-1">
               <label className="block text-xs font-bold text-[#b5bac1] uppercase mb-2">Create Custom Promo Code</label>
               <input 
                 type="text" 
                 value={customCodeInput} 
                 onChange={e => setCustomCodeInput(e.target.value)} 
                 placeholder="e.g. WAMPUS-GIFT-2026" 
                 className="w-full bg-[#1e1f22] p-2.5 rounded text-white outline-none focus:ring-2 focus:ring-[#da373c]"
               />
            </div>
            <div>
               <label className="block text-xs font-bold text-[#b5bac1] uppercase mb-2">Select Tier</label>
               <select 
                 value={customTierSelect} 
                 onChange={e => setCustomTierSelect(e.target.value)} 
                 className="w-full bg-[#1e1f22] p-2.5 rounded text-white outline-none focus:ring-2 focus:ring-[#da373c] border-r-[12px] border-transparent"
               >
                   <option value="boost">Boost</option>
                   <option value="ultra">Ultra</option>
                   <option value="ultimate">Ultimate</option>
               </select>
            </div>
            <button type="submit" disabled={!customCodeInput.trim()} className="bg-[#23a559] hover:bg-[#1f914d] disabled:opacity-50 text-white px-6 py-2.5 rounded font-medium transition">
              Create Code
            </button>
          </form>

          {generatedCode && (
            <div className="bg-[#23a559]/20 border border-[#23a559] text-[#23a559] px-4 py-3 rounded mb-6 font-mono text-lg text-center font-bold tracking-widest animate-in fade-in">
              {generatedCode}
            </div>
          )}

          <div className="bg-[#2b2d31] rounded-xl p-4">
            <div className="flex justify-between items-center mb-4">
               <h3 className="font-bold text-white">Active Promo Codes ({Object.keys(codes).length})</h3>
               <button onClick={clearCodes} className="text-xs text-[#da373c] hover:underline font-bold">Clear All</button>
            </div>
            <div className="space-y-2 overflow-y-auto max-h-60 custom-scrollbar pr-2">
               {Object.entries(codes).reverse().map(([code, tier]) => (
                 <div key={code} className="flex justify-between items-center bg-[#1e1f22] p-3 rounded-lg border border-[#3f4147]">
                   <span className="font-mono text-white font-bold tracking-wide">{code}</span>
                   <span className={`text-xs font-bold uppercase px-2.5 py-1 rounded ${tier === 'ultimate' ? 'bg-[#da373c] text-white' : tier === 'ultra' ? 'bg-[#00a8fc] text-white' : 'bg-[#5865F2] text-white'}`}>
                     {tier}
                   </span>
                 </div>
               ))}
               {Object.keys(codes).length === 0 && <div className="text-sm text-[#b5bac1] text-center py-6 bg-[#1e1f22] rounded-lg">No active codes. Create one above!</div>}
            </div>
          </div>
        </div>
      );
    }

    function ProfilesTab({ currentUser, updateUser }) {
      const [avatar, setAvatar] = useState(currentUser.avatar || '');
      const [banner, setBanner] = useState(currentUser.banner || '');
      const [bio, setBio] = useState(currentUser.bio || '');
      const [profileColor, setProfileColor] = useState(currentUser.profileColor || '#5865F2');
      const [pronouns, setPronouns] = useState(currentUser.pronouns || '');
      const [customStatus, setCustomStatus] = useState(currentUser.customStatus || '');
      const [avatarDecoration, setAvatarDecoration] = useState(currentUser.avatarDecoration || 'none');
      const [showSave, setShowSave] = useState(false);

      const hasBannerAccess = currentUser.nitroTier === 'ultra' || currentUser.nitroTier === 'ultimate';
      const hasColorAccess = currentUser.nitroTier === 'ultimate';
      const hasDecoAccess = currentUser.nitroTier === 'ultra' || currentUser.nitroTier === 'ultimate' || currentUser.nitroTier === 'boost';

      const decorations = [
        { id: 'none', label: 'None', color: 'bg-[#313338]' },
        { id: 'glow', label: 'Neon Blue', color: 'bg-[#00a8fc] shadow-[0_0_10px_#00a8fc]' },
        { id: 'gold', label: 'Golden', color: 'bg-yellow-500 shadow-[0_0_10px_#eab308]' },
        { id: 'crimson', label: 'Crimson', color: 'bg-red-500 shadow-[0_0_10px_#da373c]' }
      ];

      const getDecoClass = (id) => {
        switch(id) {
          case 'glow': return 'ring-4 ring-[#00a8fc] shadow-[0_0_15px_#00a8fc] ring-offset-2 ring-offset-[#111214]';
          case 'gold': return 'ring-4 ring-yellow-500 shadow-[0_0_15px_#eab308] ring-offset-2 ring-offset-[#111214]';
          case 'crimson': return 'ring-4 ring-red-500 shadow-[0_0_15px_#da373c] ring-offset-2 ring-offset-[#111214]';
          default: return '';
        }
      };

      const handleFile = (e, setter) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          setter(event.target.result);
          setShowSave(true);
        };
        reader.readAsDataURL(file);
      };

      const handleSave = () => {
        updateUser(currentUser.id, { avatar, banner, bio, profileColor, pronouns, customStatus, avatarDecoration });
        setShowSave(false);
      };

      const handleReset = () => {
        setAvatar(currentUser.avatar || '');
        setBanner(currentUser.banner || '');
        setBio(currentUser.bio || '');
        setProfileColor(currentUser.profileColor || '#5865F2');
        setPronouns(currentUser.pronouns || '');
        setCustomStatus(currentUser.customStatus || '');
        setAvatarDecoration(currentUser.avatarDecoration || 'none');
        setShowSave(false);
      };

      const bannerStyle = banner
        ? { backgroundImage: `url(${banner})`, backgroundSize: 'cover', backgroundPosition: 'center' }
        : { backgroundColor: profileColor };

      return (
        <div className="pb-20">
          <h2 className="text-xl font-bold mb-6 text-white">Profiles</h2>
          
          <div className="flex gap-10">
            {/* Left Side: Controls */}
            <div className="flex-1 space-y-8">
              <div>
                <h3 className="text-xs font-bold text-[#b5bac1] uppercase mb-2">Avatar</h3>
                <div className="flex items-center gap-4">
                  <label className="bg-[#5865F2] hover:bg-[#4752C4] text-white px-4 py-2 rounded font-medium transition text-sm cursor-pointer">
                    Change Avatar
                    <input type="file" accept="image/*" className="hidden" onChange={(e) => handleFile(e, setAvatar)} />
                  </label>
                </div>
              </div>

              <div className="h-[1px] bg-[#3f4147]"></div>

              <div>
                <h3 className="text-xs font-bold text-[#b5bac1] uppercase mb-2 flex items-center gap-2">
                  Avatar Decoration
                  {!hasDecoAccess && <Zap size={14} className="text-[#00a8fc] fill-[#00a8fc]" />}
                </h3>
                {hasDecoAccess ? (
                  <div className="flex gap-4">
                    {decorations.map(deco => (
                      <div 
                        key={deco.id}
                        onClick={() => { setAvatarDecoration(deco.id); setShowSave(true); }}
                        className={`flex flex-col items-center gap-2 cursor-pointer p-2 rounded-lg transition hover:bg-[#3f4147] ${avatarDecoration === deco.id ? 'bg-[#3f4147] ring-1 ring-[#00a8fc]' : ''}`}
                      >
                        <div className={`w-10 h-10 rounded-full border-2 border-[#1e1f22] ${deco.color}`}></div>
                        <span className="text-xs text-[#b5bac1] font-medium">{deco.label}</span>
                      </div>
                    ))}
                  </div>
                ) : (
                  <p className="text-sm text-[#b5bac1] bg-[#2b2d31] p-3 rounded-lg border border-[#3f4147]">
                    Unlock any Nitro tier to add cool decorations to your avatar.
                  </p>
                )}
              </div>

              <div className="h-[1px] bg-[#3f4147]"></div>

              <div>
                <h3 className="text-xs font-bold text-[#b5bac1] uppercase mb-2 flex items-center gap-2">
                  Profile Banner
                  {!hasBannerAccess && <Zap size={14} className="text-[#00a8fc] fill-[#00a8fc]" />}
                </h3>
                {hasBannerAccess ? (
                  <label className="bg-[#5865F2] hover:bg-[#4752C4] text-white px-4 py-2 rounded font-medium transition text-sm cursor-pointer inline-block">
                    Change Banner
                    <input type="file" accept="image/*" className="hidden" onChange={(e) => handleFile(e, setBanner)} />
                  </label>
                ) : (
                  <p className="text-sm text-[#b5bac1] bg-[#2b2d31] p-3 rounded-lg border border-[#3f4147]">
                    Unlock Nitro Ultra or Ultimate to customize your profile banner.
                  </p>
                )}
              </div>

              <div className="h-[1px] bg-[#3f4147]"></div>

              <div>
                <h3 className="text-xs font-bold text-[#b5bac1] uppercase mb-2 flex items-center gap-2">
                  Profile Theme Color
                  {!hasColorAccess && <Zap size={14} className="text-[#00a8fc] fill-[#00a8fc]" />}
                </h3>
                {hasColorAccess ? (
                  <div className="flex items-center gap-4">
                    <input 
                      type="color" 
                      value={profileColor} 
                      onChange={(e) => { setProfileColor(e.target.value); setShowSave(true); }}
                      className="w-12 h-12 rounded cursor-pointer bg-transparent border-0 p-0"
                    />
                    <span className="text-sm text-[#dbdee1] uppercase">{profileColor}</span>
                  </div>
                ) : (
                   <p className="text-sm text-[#b5bac1] bg-[#2b2d31] p-3 rounded-lg border border-[#3f4147]">
                    Unlock Nitro Ultimate to customize your profile theme colors.
                  </p>
                )}
              </div>

              <div className="h-[1px] bg-[#3f4147]"></div>

              <div>
                <h3 className="text-xs font-bold text-[#b5bac1] uppercase mb-2">Pronouns</h3>
                <input 
                  type="text"
                  value={pronouns}
                  onChange={(e) => { setPronouns(e.target.value); setShowSave(true); }}
                  placeholder="Add your pronouns (e.g., He/Him, They/Them)"
                  maxLength={40}
                  className="w-full bg-[#1e1f22] text-[#dbdee1] p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#00a8fc]"
                />
              </div>

              <div className="h-[1px] bg-[#3f4147]"></div>

              <div>
                <h3 className="text-xs font-bold text-[#b5bac1] uppercase mb-2">Custom Status</h3>
                <input 
                  type="text"
                  value={customStatus}
                  onChange={(e) => { setCustomStatus(e.target.value); setShowSave(true); }}
                  placeholder="What's on your mind?"
                  maxLength={60}
                  className="w-full bg-[#1e1f22] text-[#dbdee1] p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#00a8fc]"
                />
              </div>

              <div className="h-[1px] bg-[#3f4147]"></div>

              <div>
                <h3 className="text-xs font-bold text-[#b5bac1] uppercase mb-2">About Me</h3>
                <p className="text-xs text-[#b5bac1] mb-2">You can use markdown and links if you'd like.</p>
                <textarea 
                  value={bio}
                  onChange={(e) => { setBio(e.target.value); setShowSave(true); }}
                  placeholder="Who are you?"
                  maxLength={190}
                  className="w-full bg-[#1e1f22] text-[#dbdee1] p-3 rounded-lg resize-none h-32 focus:outline-none focus:ring-2 focus:ring-[#00a8fc]"
                ></textarea>
                <div className="text-right text-xs text-[#949ba4] mt-1">{190 - bio.length} characters remaining</div>
              </div>
            </div>

            {/* Right Side: Preview */}
            <div className="w-[300px] shrink-0">
              <h3 className="text-xs font-bold text-[#b5bac1] uppercase mb-4">Preview</h3>
              
              <div className="bg-[#111214] rounded-2xl overflow-hidden border border-[#1e1f22] shadow-2xl relative">
                <div className="h-[120px]" style={bannerStyle}></div>
                
                <div className="absolute top-[75px] left-4 p-1.5 bg-[#111214] rounded-full">
                  <img src={avatar} alt="Avatar" className={`w-20 h-20 rounded-full bg-[#313338] object-cover ${getDecoClass(avatarDecoration)}`} />
                  <div className={`absolute bottom-2 right-2 w-5 h-5 rounded-full border-4 border-[#111214] bg-[#23a559] ${avatarDecoration !== 'none' ? 'z-10' : ''}`}></div>
                </div>

                <div className="p-4 pt-14 bg-[#111214]">
                  <div className="bg-[#2b2d31] rounded-xl p-3 shadow-inner">
                    <div className="font-bold text-white text-lg flex items-center gap-1.5 mb-0 leading-tight">
                      {currentUser.username}
                      {currentUser.isPremium && <Zap size={16} className="text-[#00a8fc] fill-[#00a8fc]" />}
                    </div>
                    <div className="text-sm text-white mb-2">
                      {currentUser.username.toLowerCase()} {pronouns && <span className="text-[#b5bac1] ml-1">• {pronouns}</span>}
                    </div>
                    
                    {customStatus && (
                      <div className="text-sm text-[#dbdee1] mb-3 pb-3 border-b border-[#3f4147]">
                        {customStatus}
                      </div>
                    )}
                    
                    {!customStatus && <div className="w-full h-[1px] bg-[#3f4147] mb-3 mt-2"></div>}
                    
                    <div className="text-xs font-bold text-[#b5bac1] uppercase mb-1">About Me</div>
                    <div className="text-sm text-[#dbdee1] whitespace-pre-wrap break-words min-h-[20px]">
                      {bio || "No bio yet."}
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          {/* Floating Save Bar */}
          {showSave && (
            <div className="fixed bottom-10 left-[35%] w-[500px] bg-[#111214] p-3 px-5 rounded-lg flex justify-between items-center z-50 animate-in slide-in-from-bottom border border-[#1e1f22] shadow-2xl">
              <span className="text-white text-sm font-medium">Careful — you have unsaved changes!</span>
              <div className="flex gap-2">
                <button onClick={handleReset} className="text-white hover:underline px-4 py-2 text-sm font-medium">Reset</button>
                <button onClick={handleSave} className="bg-[#248046] hover:bg-[#1a6334] text-white px-4 py-2 rounded font-medium text-sm transition">Save Changes</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ---------------- VIDEO PLAYER ----------------

    function VideoPlayer({ stream, isLocal }) {
      const videoRef = useRef(null);

      useEffect(() => {
        if (videoRef.current && stream) {
          videoRef.current.srcObject = stream;
        }
      }, [stream]);

      return (
        <video 
          ref={videoRef} 
          autoPlay 
          playsInline 
          muted={isLocal} 
          className={`w-full h-full object-cover bg-[#111214] ${isLocal ? 'scale-x-[-1]' : ''}`}
        />
      );
    }

    function ServerView() {
      const { currentUser, users, servers, updateServer, activeChat, messages, addMessage } = useContext(AppContext);
      const server = servers.find(s => s.id === activeChat);
      const [msgInput, setMsgInput] = useState('');
      const chatEndRef = useRef(null);

      useEffect(() => {
        chatEndRef.current?.scrollIntoView();
      }, [messages, activeChat]);

      if (!server) return null;

      const isTgChannel = server.type === 'telegram_channel';
      const isOwner = server.ownerId === currentUser.id;
      const subscribers = server.subscribers || [server.ownerId];
      const isSubscribed = subscribers.includes(currentUser.id);

      const toggleSubscribe = () => {
        let newSubs;
        if (isSubscribed) {
          newSubs = subscribers.filter(id => id !== currentUser.id);
        } else {
          newSubs = [...subscribers, currentUser.id];
        }
        updateServer(server.id, { subscribers: newSubs });
      };

      const chatMessages = messages.filter(m => m.serverId === server.id).sort((a, b) => a.createdAt - b.createdAt);

      const handleSend = (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          if (!msgInput.trim()) return;
          if (isTgChannel && !isOwner) return; // Only owner can broadcast in TG Channels

          addMessage({
            serverId: server.id,
            senderId: currentUser.id,
            text: msgInput.trim(),
            createdAt: Date.now()
          });
          setMsgInput('');
        }
      };

      return (
        <div className="flex flex-col h-full bg-[#313338]">
          {/* Server / Channel Header */}
          <div className="h-12 border-b border-[#1f2023] flex items-center justify-between px-4 shadow-sm shrink-0">
            <div className="flex items-center gap-2">
              {isTgChannel ? <span className="text-xl">📢</span> : <Hash size={24} className="text-[#80848e]" />}
              <span className="font-semibold text-white">{server.name}</span>
              {isTgChannel && (
                <span className="text-xs bg-[#0088cc]/20 text-[#00a8fc] border border-[#00a8fc]/30 px-2 py-0.5 rounded font-medium">
                  Telegram Channel • {subscribers.length} Subscribers
                </span>
              )}
            </div>

            {isTgChannel && !isOwner && (
              <button 
                onClick={toggleSubscribe} 
                className={`px-4 py-1.5 rounded font-medium text-xs transition ${isSubscribed ? 'bg-[#2b2d31] text-[#b5bac1] hover:bg-[#da373c]/20 hover:text-[#da373c]' : 'bg-[#0088cc] hover:bg-[#0077bb] text-white'}`}
              >
                {isSubscribed ? 'Subscribed' : 'Join Channel'}
              </button>
            )}
          </div>

          {/* Chat History */}
          <div className="flex-1 overflow-y-auto px-4 py-6 space-y-4 custom-scrollbar">
            <div className="flex flex-col justify-end min-h-full">
              <div className="mb-8">
                <div className={`w-16 h-16 rounded-full flex items-center justify-center mb-4 ${isTgChannel ? 'bg-[#0088cc]' : 'bg-[#4e5058]'}`}>
                  {isTgChannel ? <span className="text-3xl">📢</span> : <Hash size={32} className="text-white" />}
                </div>
                <h1 className="text-3xl font-bold text-white mb-2">
                  Welcome to {isTgChannel ? `📢 ${server.name}` : '#general'}!
                </h1>
                <p className="text-[#b5bac1]">
                  {isTgChannel 
                    ? `This is the official Telegram-style broadcast channel for ${server.name}. Only channel admins can post updates.` 
                    : `This is the start of the #general channel in ${server.name}.`}
                </p>
              </div>

              {chatMessages.map((msg, i) => {
                const sender = users.find(u => u.id === msg.senderId) || { username: 'Channel Admin', avatar: 'https://api.dicebear.com/7.x/identicon/svg?seed=Admin' };
                const showHeader = i === 0 || chatMessages[i - 1].senderId !== msg.senderId || (msg.createdAt - chatMessages[i - 1].createdAt) > 300000;
                
                return (
                  <div key={msg.id} className={`flex gap-4 hover:bg-[#2e3035] p-2 -mx-4 px-4 rounded ${!showHeader ? 'mt-0' : 'mt-4'} ${isTgChannel ? 'bg-[#2b2d31]/50 border-l-4 border-[#0088cc] my-2' : ''}`}>
                    {showHeader ? (
                      <img src={sender.avatar} className="w-10 h-10 rounded-full cursor-pointer hover:opacity-80" alt="avatar" />
                    ) : (
                      <div className="w-10 flex-shrink-0 text-right">
                         <span className="text-[10px] text-[#b5bac1] opacity-0 group-hover:opacity-100 hidden">
                           {new Date(msg.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
                         </span>
                      </div>
                    )}
                    <div className="flex flex-col min-w-0 flex-1">
                      {showHeader && (
                        <div className="flex items-baseline justify-between">
                          <span className="text-white font-medium hover:underline cursor-pointer flex items-center gap-1">
                            {sender.username}
                            {isTgChannel && <span className="text-[10px] bg-[#0088cc] text-white px-1.5 py-0.2 rounded">ADMIN</span>}
                            {sender.isPremium && <Zap size={14} className="text-[#00a8fc] fill-[#00a8fc]" />}
                          </span>
                          <span className="text-xs text-[#949ba4]">
                            {new Date(msg.createdAt).toLocaleString([], { dateStyle: 'short', timeStyle: 'short' })}
                          </span>
                        </div>
                      )}
                      <span className="text-[#dbdee1] whitespace-pre-wrap break-words mt-1">{msg.text}</span>
                      {isTgChannel && (
                        <div className="text-[11px] text-[#b5bac1] flex justify-end gap-2 mt-2">
                           <span>👁 {Math.floor(subscribers.length * 1.5) + 1} views</span>
                        </div>
                      )}
                    </div>
                  </div>
                );
              })}
              <div ref={chatEndRef} />
            </div>
          </div>

          {/* Chat Input */}
          <div className="px-4 pb-6 pt-2 shrink-0">
            {isTgChannel && !isOwner ? (
              <div className="bg-[#2b2d31] rounded-lg text-center py-3 text-[#b5bac1] text-sm border border-[#3f4147]">
                🔒 Read Only Channel. Only channel administrators can post messages.
              </div>
            ) : (
              <div className="bg-[#383a40] rounded-lg flex items-center px-4 py-2.5">
                <button className="text-[#b5bac1] hover:text-[#dbdee1] mr-4"><Plus size={24} className="bg-[#4e5058] rounded-full p-1" /></button>
                <input 
                  type="text"
                  placeholder={isTgChannel ? `Broadcast a post to channel subscribers...` : "Message #general"}
                  className="flex-1 bg-transparent text-[#dbdee1] outline-none placeholder-[#b5bac1]"
                  value={msgInput}
                  onChange={(e) => setMsgInput(e.target.value)}
                  onKeyDown={handleSend}
                />
                <div className="flex items-center gap-3 text-[#b5bac1] ml-4">
                  <button className="hover:text-[#dbdee1]"><ImageIcon size={24} /></button>
                  <button className="hover:text-[#dbdee1]"><Smile size={24} /></button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    function CreateServerModal({ onClose }) {
      const { currentUser, addServer, setActiveView, setActiveChat } = useContext(AppContext);
      const [createType, setCreateType] = useState('server'); // 'server' or 'telegram_channel'
      const [name, setName] = useState('');

      useEffect(() => {
        setName(createType === 'server' ? `${currentUser.username}'s server` : `${currentUser.username}'s Channel`);
      }, [createType, currentUser.username]);

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!name.trim()) return;
        
        const newServer = addServer({
          name: name.trim(),
          type: createType,
          ownerId: currentUser.id,
          subscribers: [currentUser.id],
          icon: `https://api.dicebear.com/7.x/initials/svg?seed=${encodeURIComponent(name.trim())}`,
          createdAt: Date.now()
        });

        setActiveView('server');
        setActiveChat(newServer.id);
        onClose();
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm animate-in fade-in duration-200">
          <div className="bg-[#313338] text-white w-full max-w-md rounded-xl shadow-2xl overflow-hidden flex flex-col">
            <div className="p-6 text-center relative">
              <button onClick={onClose} className="absolute top-4 right-4 text-[#b5bac1] hover:text-[#dbdee1] transition">
                <X size={24} />
              </button>
              
              <h2 className="text-2xl font-bold mb-2">Create a Space</h2>
              <p className="text-[#b5bac1] text-sm mb-6">Choose whether you want a community server or a Telegram-style broadcast channel.</p>
              
              {/* Selector Type */}
              <div className="grid grid-cols-2 gap-3 mb-6">
                <button 
                  type="button" 
                  onClick={() => setCreateType('server')}
                  className={`p-3 rounded-xl border flex flex-col items-center gap-2 transition ${createType === 'server' ? 'border-[#5865F2] bg-[#5865F2]/20 text-white' : 'border-[#3f4147] bg-[#2b2d31] text-[#b5bac1]'}`}
                >
                  <Users size={28} />
                  <span className="font-bold text-sm">Discord Server</span>
                </button>
                <button 
                  type="button" 
                  onClick={() => setCreateType('telegram_channel')}
                  className={`p-3 rounded-xl border flex flex-col items-center gap-2 transition ${createType === 'telegram_channel' ? 'border-[#0088cc] bg-[#0088cc]/20 text-white' : 'border-[#3f4147] bg-[#2b2d31] text-[#b5bac1]'}`}
                >
                  <span className="text-2xl">📢</span>
                  <span className="font-bold text-sm">TG Channel</span>
                </button>
              </div>

              <form id="create-space-form" onSubmit={handleSubmit} className="text-left">
                <label className="block text-xs font-bold text-[#b5bac1] uppercase mb-2">
                  {createType === 'server' ? 'Server Name' : 'Channel Name'}
                </label>
                <input 
                  type="text" 
                  value={name}
                  onChange={(e) => setName(e.target.value)}
                  className="w-full bg-[#1e1f22] text-white p-2.5 rounded focus:outline-none focus:ring-2 focus:ring-[#00a8fc]"
                  required
                />
              </form>
            </div>
            <div className="bg-[#2b2d31] p-4 flex justify-between items-center shrink-0">
              <button onClick={onClose} className="text-[#dbdee1] hover:underline font-medium text-sm px-4 py-2">Back</button>
              <button form="create-space-form" type="submit" className={`text-white font-medium text-sm px-6 py-2.5 rounded transition ${createType === 'telegram_channel' ? 'bg-[#0088cc] hover:bg-[#0077bb]' : 'bg-[#5865F2] hover:bg-[#4752C4]'}`}>
                Create {createType === 'server' ? 'Server' : 'Channel'}
              </button>
            </div>
          </div>
        </div>
      );
    }

    // Инициализация React-приложения
    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
