<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discord Clone</title>

  <!-- Подключаем Tailwind CSS для стилей -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Кастомные скроллбары, которые используются в вашем коде -->
  <style>
    body { margin: 0; background-color: #1e1f22; color: white; color-scheme: dark; }
    .custom-scrollbar::-webkit-scrollbar { width: 8px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #2b2d31; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #1a1b1e; border-radius: 4px; }
    .hidden-scrollbar::-webkit-scrollbar { display: none; }
  </style>

  <!-- Настраиваем импорты для React и lucide-react -->
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.2.0",
      "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
      "lucide-react": "https://esm.sh/lucide-react@0.292.0"
    }
  }
  </script>

  <!-- Подключаем Babel, чтобы браузер понимал разметку JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <!-- Контейнер, куда отрендерится React-приложение -->
  <div id="root"></div>

  <!-- Ваш React код -->
  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useRef, createContext, useContext } from 'react';
    import { createRoot } from 'react-dom/client';
    import { 
      X, Settings, LogOut, Send, Hash, Users, Plus, Mic, MicOff, Video, VideoOff, 
      PhoneCall, Image as ImageIcon, Smile, Crown, Check, AlertCircle, ShieldAlert, MonitorUp, Zap
    } from 'lucide-react';

    const AppContext = createContext();

    // --- MOCK DATABASE HOOK ---
    // Uses localStorage to simulate a database since we might not have a reliable cloud backend in this sandbox.
    function useMockDB(collectionName) {
      const [data, setData] = useState([]);
      
      useEffect(() => {
        const loadLocal = () => {
          try {
            const stored = localStorage.getItem(`mydiscord_mock_${collectionName}`);
            if (stored) {
              setData(JSON.parse(stored));
            } else if (collectionName === 'users') {
              // Default admin user
              const defaultUsers = [
                { 
                  id: 'user_wampus', 
                  username: 'Wampus', 
                  password: '123', 
                  avatar: 'https://api.dicebear.com/7.x/identicon/svg?seed=Wampus', 
                  banner: '', 
                  pronouns: 'He/Him',
                  customStatus: 'Building Discord in React ✨',
                  avatarDecoration: 'gold',
                  status: 'online', 
                  nitroTier: 'ultimate', 
                  isPremium: true, 
                  createdAt: Date.now() 
                }
              ];
              setData(defaultUsers);
              localStorage.setItem(`mydiscord_mock_${collectionName}`, JSON.stringify(defaultUsers));
            } else {
              setData([]);
            }
          } catch (err) {
            setData([]);
          }
        };
        
        loadLocal();
        
        // Listen for local storage changes to sync tabs
        const handleStorageChange = (e) => {
          if (e.key === `mydiscord_mock_${collectionName}`) {
            loadLocal();
          }
        };
        window.addEventListener('storage', handleStorageChange);
        return () => window.removeEventListener('storage', handleStorageChange);
      }, [collectionName]);

      const addDoc = (docData) => {
        const newDoc = { id: `${collectionName}_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`, ...docData };
        const updatedData = [...data, newDoc];
        setData(updatedData);
        localStorage.setItem(`mydiscord_mock_${collectionName}`, JSON.stringify(updatedData));
        // Trigger storage event manually for same-tab updates
        window.dispatchEvent(new StorageEvent('storage', { key: `mydiscord_mock_${collectionName}` }));
        return newDoc;
      };

      const updateDoc = (id, updates) => {
        const updatedData = data.map(doc => doc.id === id ? { ...doc, ...updates } : doc);
        setData(updatedData);
        localStorage.setItem(`mydiscord_mock_${collectionName}`, JSON.stringify(updatedData));
        window.dispatchEvent(new StorageEvent('storage', { key: `mydiscord_mock_${collectionName}` }));
      };

      return { data, addDoc, updateDoc };
    }

    function App() {
      const [currentUser, setCurrentUser] = useState(null);
      const [authMode, setAuthMode] = useState('login'); // 'login' or 'register'
      const [usernameInput, setUsernameInput] = useState('');
      const [passwordInput, setPasswordInput] = useState('');
      const [authError, setAuthError] = useState('');

      const { data: users, addDoc: addUser, updateDoc: updateUser } = useMockDB('users');
      const { data: friends, addDoc: addFriendRelation, updateDoc: updateFriendRelation } = useMockDB('friends');
      const { data: messages, addDoc: addMessage } = useMockDB('messages');
      const { data: servers, addDoc: addServer, updateDoc: updateServer } = useMockDB('servers');
      
      const [activeView, setActiveView] = useState('friends'); // 'friends', 'dm', 'server'
      const [activeChat, setActiveChat] = useState(null); // ID of friend or channel/server
      const [showSettings, setShowSettings] = useState(false);
      const [showCreateServer, setShowCreateServer] = useState(false);
      const [createType, setCreateType] = useState('server'); // 'server' or 'channel'

      // --- WEBRTC SIGNALING & STATE ---
      const [incomingCall, setIncomingCall] = useState(null);
      const [activeCall, setActiveCall] = useState(null);
      const [localStream, setLocalStream] = useState(null);
      const [remoteStream, setRemoteStream] = useState(null);
      const [isAudioMuted, setIsAudioMuted] = useState(false);
      const [isVideoOff, setIsVideoOff] = useState(false);
      const pcRef = useRef(null);

      const sendSignal = (to, type, payload) => {
        localStorage.setItem('mydiscord_signal', JSON.stringify({
          to, from: currentUser?.id, type, payload, ts: Date.now(), rnd: Math.random()
        }));
      };

      useEffect(() => {
        if (!currentUser) return;
        const handleStorage = (e) => {
          if (e.key === 'mydiscord_signal' && e.newValue) {
            const signal = JSON.parse(e.newValue);
            if (signal.to !== currentUser.id) return;

            if (signal.type === 'offer') {
               setIncomingCall({ callerId: signal.from, offer: signal.payload, isVideo: true });
            } else if (signal.type === 'answer' && pcRef.current) {
               pcRef.current.setRemoteDescription(new RTCSessionDescription(signal.payload));
            } else if (signal.type === 'ice' && pcRef.current) {
               pcRef.current.addIceCandidate(new RTCIceCandidate(signal.payload)).catch(err => console.log('ICE queue', err));
            } else if (signal.type === 'end') {
               endCall(false);
            }
          }
        };
        window.addEventListener('storage', handleStorage);
        return () => window.removeEventListener('storage', handleStorage);
      }, [currentUser]);

      const setupPC = (partnerId) => {
        const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
        pc.onicecandidate = (e) => {
           if (e.candidate) sendSignal(partnerId, 'ice', e.candidate);
        };
        pc.ontrack = (e) => {
           setRemoteStream(e.streams[0]);
        };
        pcRef.current = pc;
        return pc;
      };

      const startCall = async (partnerId, isVideo = true) => {
         try {
           const stream = await navigator.mediaDevices.getUserMedia({ video: isVideo, audio: true });
           setLocalStream(stream);
           setActiveCall({ partnerId, status: 'calling', isVideo });
           setIsAudioMuted(false);
           setIsVideoOff(!isVideo);
           
           const pc = setupPC(partnerId);
           stream.getTracks().forEach(t => pc.addTrack(t, stream));
           
           const offer = await pc.createOffer();
           await pc.setLocalDescription(offer);
           sendSignal(partnerId, 'offer', offer);
           
           // DEMO FALLBACK: If no one answers in 2.5s (like in a single tab), auto-connect a loopback stream
           setTimeout(() => {
             setActiveCall(curr => (curr && curr.status === 'calling' ? { ...curr, status: 'connected' } : curr));
             setRemoteStream(prev => prev || stream); // Use local stream as remote
           }, 2500);

         } catch (err) {
           console.error("Media error", err);
           alert("Could not access camera/microphone.");
         }
      };

      const acceptCall = async () => {
         if (!incomingCall) return;
         try {
           const stream = await navigator.mediaDevices.getUserMedia({ video: incomingCall.isVideo, audio: true });
           setLocalStream(stream);
           setActiveCall({ partnerId: incomingCall.callerId, status: 'connected', isVideo: incomingCall.isVideo });
           setIsAudioMuted(false);
           setIsVideoOff(!incomingCall.isVideo);
           setActiveView('dm');
           setActiveChat(incomingCall.callerId);

           const pc = setupPC(incomingCall.callerId);
           stream.getTracks().forEach(t => pc.addTrack(t, stream));
           
           await pc.setRemoteDescription(new RTCSessionDescription(incomingCall.offer));
           const answer = await pc.createAnswer();
           await pc.setLocalDescription(answer);
           sendSignal(incomingCall.callerId, 'answer', answer);
           setIncomingCall(null);
         } catch (err) {
           console.error("Media error", err);
         }
      };

      const endCall = (broadcast = true) => {
         if (broadcast && activeCall) {
            sendSignal(activeCall.partnerId, 'end', null);
         }
         if (pcRef.current) {
            pcRef.current.close();
            pcRef.current = null;
         }
         if (localStream) {
            localStream.getTracks().forEach(t => t.stop());
         }
         setLocalStream(null);
         setRemoteStream(null);
         setActiveCall(null);
         setIncomingCall(null);
      };

      const toggleAudio = () => {
        if (localStream) {
           const track = localStream.getAudioTracks()[0];
           if (track) {
             track.enabled = !track.enabled;
             setIsAudioMuted(!track.enabled);
           }
        }
      };

      const toggleVideo = () => {
        if (localStream) {
           const track = localStream.getVideoTracks()[0];
           if (track) {
             track.enabled = !track.enabled;
             setIsVideoOff(!track.enabled);
           }
        }
      };

      const shareScreen = async () => {
         if (!pcRef.current || !localStream) return;
         try {
           const screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
           const screenTrack = screenStream.getVideoTracks()[0];
           
           const senders = pcRef.current.getSenders();
           const videoSender = senders.find(s => s.track && s.track.kind === 'video');
           if (videoSender) {
              videoSender.replaceTrack(screenTrack);
           }
           
           const audioTracks = localStream.getAudioTracks();
           const newStream = new MediaStream([screenTrack, ...audioTracks]);
           setLocalStream(newStream);

           screenTrack.onended = () => {
              navigator.mediaDevices.getUserMedia({ video: !isVideoOff }).then(camStream => {
                 const camTrack = camStream.getVideoTracks()[0];
                 if (videoSender && camTrack) videoSender.replaceTrack(camTrack);
                 setLocalStream(new MediaStream([camTrack, ...audioTracks]));
              });
           };
         } catch (err) {
           console.error("Screen share error", err);
         }
      };

      useEffect(() => {
        const savedUid = localStorage.getItem('discord_uid');
        if (savedUid && users.length > 0) {
          const user = users.find(u => u.id === savedUid);
          if (user) {
            setCurrentUser(user);
          }
        }
      }, [users]);

      const handleAuthSubmit = (e) => {
        e.preventDefault();
        setAuthError('');
        
        if (authMode === 'login') {
           const foundUser = users.find(u => u.username.toLowerCase() === usernameInput.trim().toLowerCase() && u.password === passwordInput);
           if (foundUser) {
             localStorage.setItem('discord_uid', foundUser.id);
             setCurrentUser(foundUser);
           } else {
             setAuthError('Invalid username or password');
           }
        } else {
          if (usernameInput.trim().length < 3) {
            setAuthError('Username must be at least 3 characters.');
            return;
          }
          const userExists = users.some(u => u.username.toLowerCase() === usernameInput.trim().toLowerCase());
          if (userExists) {
            setAuthError('Username already taken.');
            return;
          }

          const newUserObj = {
            username: usernameInput.trim(),
            password: passwordInput,
            avatar: `https://api.dicebear.com/7.x/identicon/svg?seed=${usernameInput.trim()}`,
            banner: '',
            pronouns: '',
            customStatus: '',
            avatarDecoration: 'none',
            status: 'online',
            nitroTier: usernameInput.trim().toLowerCase() === 'wampus' ? 'ultimate' : 'none',
            isPremium: usernameInput.trim().toLowerCase() === 'wampus',
            createdAt: Date.now()
          };

          const createdUser = addUser(newUserObj);
          localStorage.setItem('discord_uid', createdUser.id);
          setCurrentUser(createdUser);
        }
      };

      const handleLogout = () => {
        localStorage.removeItem('discord_uid');
        setCurrentUser(null);
        setUsernameInput('');
        setPasswordInput('');
      };

      // ---------------- AUTH SCREEN ----------------
      if (!currentUser) {
        return (
          <div className="flex h-screen w-full items-center justify-center bg-[#1e1f22] relative overflow-hidden">
            {/* Discord Geometric / Neon Background Accents */}
            <div className="absolute -top-32 -left-32 w-96 h-96 bg-[#5865F2]/20 rounded-full blur-[120px] pointer-events-none"></div>
            <div className="absolute -bottom-32 -right-32 w-96 h-96 bg-[#00a8fc]/20 rounded-full blur-[120px] pointer-events-none"></div>
            <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-[#5865F2]/10 rounded-full blur-[150px] pointer-events-none"></div>
            
            {/* Ambient SVG pattern overlay */}
            <div className="absolute inset-0 opacity-5 pointer-events-none bg-[radial-gradient(#ffffff_1px,transparent_1px)] [background-size:24px_24px]"></div>

            <div className="z-10 w-full max-w-[480px] p-8 bg-[#313338]/90 backdrop-blur-md text-white rounded-xl shadow-[0_8px_32px_rgba(0,0,0,0.5)] border border-[#3f4147]/50">
              <div className="text-center mb-6">
                <div className="w-12 h-12 bg-[#5865F2] rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-[#5865F2]/30">
                  <svg width="28" height="20" viewBox="0 0 28 20" fill="currentColor"><path d="M23.0212 1.67671C21.3107 0.879656 19.5079 0.318797 17.6584 0C17.4062 0.461742 17.1749 0.934541 16.9708 1.4184C15.003 1.12145 12.9974 1.12145 11.0283 1.4184C10.819 0.934541 10.589 0.461744 10.3368 0C8.48074 0.318799 6.68449 0.879656 4.97396 1.67671C1.56727 6.77853 0.649666 11.7538 1.11108 16.652C3.10102 18.1418 5.3262 19.0584 7.69177 19.646C8.22338 18.913 8.68725 18.1343 9.07174 17.3117C8.2612 17.0039 7.49132 16.6212 6.75887 16.1668C6.94276 16.0305 7.1264 15.892 7.30058 15.7483C11.1396 17.5147 16.892 17.5147 20.7042 15.7483C20.8784 15.892 21.062 16.0305 21.2471 16.1668C20.5135 16.6212 19.7424 17.0039 18.9318 17.3117C19.3275 18.1343 19.7913 18.913 20.323 19.646C22.6885 19.0584 24.9138 18.1418 26.9037 16.652C27.4693 10.9859 26.1158 6.07106 23.0212 1.67671ZM9.68041 13.6383C8.39754 13.6383 7.34085 12.4453 7.34085 10.994C7.34085 9.54272 8.37155 8.34973 9.68041 8.34973C10.9893 8.34973 12.0395 9.54272 12.0187 10.994C12.0187 12.4453 10.9828 13.6383 9.68041 13.6383ZM18.3161 13.6383C17.0332 13.6383 15.9765 12.4453 15.9765 10.994C15.9765 9.54272 17.0072 8.34973 18.3161 8.34973C19.625 8.34973 20.6751 9.54272 20.6543 10.994C20.6543 12.4453 19.625 13.6383 18.3161 13.6383Z"/></svg>
                </div>
                <h2 className="text-2xl font-bold mb-1">
                  {authMode === 'login' ? 'Welcome back!' : 'Create an account'}
                </h2>
                <p className="text-[#b5bac1] text-sm">
                  {authMode === 'login' ? "We're so excited to see you again!" : "Join the ultimate community."}
                </p>
              </div>

              <form onSubmit={handleAuthSubmit} className="space-y-4">
                <div>
                  <label className="block text-xs font-bold text-[#b5bac1] uppercase mb-2">Username</label>
                  <input 
                    type="text" 
                    value={usernameInput}
                    onChange={(e) => setUsernameInput(e.target.value)}
                    className="w-full p-2.5 bg-[#1e1f22] rounded text-white focus:outline-none focus:ring-2 focus:ring-[#5865F2] border border-[#2b2d31]"
                    required
                  />
                </div>
                
                <div>
                  <label className="block text-xs font-bold text-[#b5bac1] uppercase mb-2">Password</label>
                  <input 
                    type="password" 
                    value={passwordInput}
                    onChange={(e) => setPasswordInput(e.target.value)}
                    className="w-full p-2.5 bg-[#1e1f22] rounded text-white focus:outline-none focus:ring-2 focus:ring-[#5865F2] border border-[#2b2d31]"
                    required
                  />
                </div>

                {authError && <div className="text-[#da373c] text-sm font-medium">{authError}</div>}

                <button type="submit" className="w-full bg-[#5865F2] hover:bg-[#4752C4] transition text-white font-medium py-2.5 rounded shadow-lg shadow-[#5865F2]/20">
                  {authMode === 'login' ? 'Log In' : 'Register'}
                </button>

                <div className="mt-4 text-sm text-[#b5bac1]">
                  {authMode === 'login' ? 'Need an account? ' : 'Already have an account? '}
                  <span 
                    className="text-[#00a8fc] hover:underline cursor-pointer font-medium"
                    onClick={() => { setAuthMode(authMode === 'login' ? 'register' : 'login'); setAuthError(''); }}
                  >
                    {authMode === 'login' ? 'Register' : 'Log in'}
                  </span>
                </div>
              </form>
            </div>
          </div>
        );
      }

      return (
        <AppContext.Provider value={{ 
          currentUser, users, friends, messages, addMessage, addFriendRelation, updateFriendRelation, updateUser, servers, addServer, updateServer, setActiveView, setActiveChat, setShowSettings, activeView, activeChat,
          activeCall, startCall, endCall, toggleAudio, toggleVideo, shareScreen, localStream, remoteStream, isAudioMuted, isVideoOff
        }}>
          {incomingCall && (
            <div className="fixed top-12 left-1/2 -translate-x-1/2 z-50 bg-[#1e1f22] p-4 rounded-xl shadow-[0_0_40px_rgba(0,0,0,0.5)] flex items-center gap-6 border border-[#3f4147] animate-in slide-in-from-top-10">
               <div className="flex items-center gap-4">
                 {users.find(u => u.id === incomingCall.callerId)?.avatar && (
                   <img src={users.find(u => u.id === incomingCall.callerId).avatar} alt="caller" className="w-12 h-12 rounded-full animate-pulse border-2 border-[#2b2d31]" />
                 )}
                 <div>
                   <div className="font-bold text-white">{users.find(u => u.id === incomingCall.callerId)?.username || 'Someone'} is calling...</div>
                   <div className="text-xs text-[#b5bac1]">{incomingCall.isVideo ? 'Incoming Video Call' : 'Incoming Voice Call'}</div>
                 </div>
               </div>
               <div className="flex gap-2">
                 <button onClick={acceptCall} className="bg-[#23a559] hover:bg-[#1f914d] text-white px-4 py-2 rounded-lg font-medium text-sm transition flex items-center gap-2">
                   <PhoneCall size={16} /> Accept
                 </button>
                 <button onClick={() => endCall(true)} className="bg-[#da373c] hover:bg-[#c92b30] text-white px-4 py-2 rounded-lg font-medium text-sm transition flex items-center gap-2">
                   <X size={16} /> Decline
                 </button>
               </div>
            </div>
          )}

          <div className="flex h-screen w-full bg-[#313338] text-white font-sans overflow-hidden">
            {/* SERVERS / CHANNELS SIDEBAR */}
            <div className="w-[72px] bg-[#1e1f22] flex flex-col items-center py-3 gap-2 overflow-y-auto hidden-scrollbar">
              <div 
                onClick={() => setActiveView('friends')}
                className={`w-12 h-12 rounded-[24px] hover:rounded-[16px] transition-all duration-300 flex items-center justify-center cursor-pointer ${activeView === 'friends' || activeView === 'dm' ? 'bg-[#5865F2] text-white rounded-[16px]' : 'bg-[#313338] text-[#dbdee1] hover:bg-[#5865F2] hover:text-[#ffffff]'}`}
              >
                <svg width="28" height="20" viewBox="0 0 28 20" fill="currentColor"><path d="M23.0212 1.67671C21.3107 0.879656 19.5079 0.318797 17.6584 0C17.4062 0.461742 17.1749 0.934541 16.9708 1.4184C15.003 1.12145 12.9974 1.12145 11.0283 1.4184C10.819 0.934541 10.589 0.461744 10.3368 0C8.48074 0.318799 6.68449 0.879656 4.97396 1.67671C1.56727 6.77853 0.649666 11.7538 1.11108 16.652C3.10102 18.1418 5.3262 19.0584 7.69177 19.646C8.22338 18.913 8.68725 18.1343 9.07174 17.3117C8.2612 17.0039 7.49132 16.6212 6.75887 16.1668C6.94276 16.0305 7.1264 15.892 7.30058 15.7483C11.1396 17.5147 16.892 17.5147 20.7042 15.7483C20.8784 15.892 21.062 16.0305 21.2471 16.1668C20.5135 16.6212 19.7424 17.0039 18.9318 17.3117C19.3275 18.1343 19.7913 18.913 20.323 19.646C22.6885 19.0584 24.9138 18.1418 26.9037 16.652C27.4693 10.9859 26.1158 6.07106 23.0212 1.67671ZM9.68041 13.6383C8.39754 13.6383 7.34085 12.4453 7.34085 10.994C7.34085 9.54272 8.37155 8.34973 9.68041 8.34973C10.9893 8.34973 12.0395 9.54272 12.0187 10.994C12.0187 12.4453 10.9828 13.6383 9.68041 13.6383ZM18.3161 13.6383C17.0332 13.6383 15.9765 12.4453 15.9765 10.994C15.9765 9.54272 17.0072 8.34973 18.3161 8.34973C19.625 8.34973 20.6751 9.54272 20.6543 10.994C20.6543 12.4453 19.625 13.6383 18.3161 13.6383Z"/></svg>
              </div>
              <div className="w-8 h-[2px] bg-[#3f4147] rounded my-1"></div>
              
              {servers.map(server => (
                <div 
                  key={server.id} 
                  onClick={() => { setActiveView('server'); setActiveChat(server.id); }}
                  className={`relative w-12 h-12 rounded-[24px] hover:rounded-[16px] transition-all duration-300 flex items-center justify-center cursor-pointer overflow-hidden ${activeView === 'server' && activeChat === server.id ? 'rounded-[16px] border-2 border-[#5865F2]' : 'bg-[#313338]'}`}
                  title={`${server.name} (${server.type === 'telegram_channel' ? 'Telegram Channel' : 'Server'})`}
                >
                  {server.type === 'telegram_channel' ? (
                    <div className="w-full h-full bg-[#0088cc] flex items-center justify-center text-white font-bold">
                      📢
                    </div>
                  ) : (
                    <img src={server.icon} alt={server.name} className="w-full h-full object-cover" />
                  )}
                </div>
              ))}

              <div 
                onClick={() => setShowCreateServer(true)}
                className="w-12 h-12 rounded-[24px] hover:rounded-[16px] transition-all duration-300 bg-[#313338] text-[#23a559] hover:bg-[#23a559] hover:text-white flex items-center justify-center cursor-pointer"
                title="Create Server or Channel"
              >
                <Plus size={24} />
              </div>
            </div>

            {/* DIRECT MESSAGES / CHANNELS LIST SIDEBAR */}
            <div className="w-60 bg-[#2b2d31] flex flex-col justify-between select-none">
              {activeView === 'server' ? (
                <div className="flex-1 flex flex-col">

    // ---------------- VIEWS ----------------

    function FriendsView() {
      const { currentUser, users, friends, addFriendRelation, updateFriendRelation } = useContext(AppContext);
      const [tab, setTab] = useState('online'); // online, all, pending, add
      const [addInput, setAddInput] = useState('');
      const [addStatus, setAddStatus] = useState(null);

      const getFriendData = () => {
        let list = [];
        let pendingList = [];

        friends.forEach(f => {
          if (f.user1Id === currentUser.id) {
            const friend = users.find(u => u.id === f.user2Id);
            if (friend) {
              if (f.status === 'accepted') list.push(friend);
              else if (f.status === 'pending') pendingList.push({ ...friend, relationId: f.id, type: 'outgoing' });
            }
          } else if (f.user2Id === currentUser.id) {
            const friend = users.find(u => u.id === f.user1Id);
            if (friend) {
              if (f.status === 'accepted') list.push(friend);
              else if (f.status === 'pending') pendingList.push({ ...friend, relationId: f.id, type: 'incoming' });
            }
          }
        });
        return { list, pendingList };
      };

      const { list, pendingList } = getFriendData();

      const handleAddFriend = (e) => {
        e.preventDefault();
        const targetUser = users.find(u => u.username.toLowerCase() === addInput.trim().toLowerCase());
        
        if (!targetUser) {
          setAddStatus({ type: 'error', text: "Hm, didn't work. Double check that the username is correct." });
          return;
        }
        if (targetUser.id === currentUser.id) {
          setAddStatus({ type: 'error', text: "You can't add yourself as a friend." });
          return;
        }
        
        // Check if relation already exists
        const exists = friends.find(f => 
          (f.user1Id === currentUser.id && f.user2Id === targetUser.id) || 
          (f.user1Id === targetUser.id && f.user2Id === currentUser.id)
        );

        if (exists) {
          setAddStatus({ type: 'error', text: "You're already friends or have a pending request." });
          return;
        }

        addFriendRelation({
          user1Id: currentUser.id,
          user2Id: targetUser.id,
          status: 'pending',
          createdAt: Date.now()
        });
        
        setAddStatus({ type: 'success', text: `Success! Your friend request to ${targetUser.username} was sent.` });
        setAddInput('');
      };

      const handleAcceptRequest = (relationId) => {
        updateFriendRelation(relationId, { status: 'accepted' });
      };

      return (
        <div className="flex flex-col h-full">
          <div className="h-12 border-b border-[#1f2023] flex items-center px-4 gap-4 shadow-sm">
            <div className="flex items-center gap-2 font-semibold text-white mr-4">
              <Users size={20} className="text-[#80848e]" />
              Friends
            </div>
            <div className="h-6 w-[1px] bg-[#3f4147]"></div>
            <div className="flex gap-4 text-sm font-medium">
              <button onClick={() => setTab('online')} className={`px-2 py-1 rounded ${tab === 'online' ? 'bg-[#404249] text-white' : 'text-[#b5bac1] hover:bg-[#3f4147] hover:text-[#dbdee1]'}`}>Online</button>
              <button onClick={() => setTab('all')} className={`px-2 py-1 rounded ${tab === 'all' ? 'bg-[#404249] text-white' : 'text-[#b5bac1] hover:bg-[#3f4147] hover:text-[#dbdee1]'}`}>All</button>
              <button onClick={() => setTab('pending')} className={`px-2 py-1 rounded flex items-center gap-1 ${tab === 'pending' ? 'bg-[#404249] text-white' : 'text-[#b5bac1] hover:bg-[#3f4147] hover:text-[#dbdee1]'}`}>
                Pending
                {pendingList.filter(p => p.type === 'incoming').length > 0 && (
                  <span className="bg-[#da373c] text-white text-[10px] w-4 h-4 flex items-center justify-center rounded-full">
                    {pendingList.filter(p => p.type === 'incoming').length}
                  </span>
                )}
              </button>
              <button onClick={() => setTab('add')} className={`px-2 py-1 rounded text-white bg-[#248046] hover:bg-[#1a6334]`}>Add Friend</button>
            </div>
          </div>

          <div className="flex-1 p-6 overflow-y-auto custom-scrollbar">
            {tab === 'add' && (
              <div>
                <h2 className="text-white font-semibold mb-2">ADD FRIEND</h2>
                <p className="text-sm text-[#b5bac1] mb-4">You can add a friend with their exact Username.</p>
                <form onSubmit={handleAddFriend} className={`flex items-center bg-[#1e1f22] p-2 rounded-lg border focus-within:border-[#00a8fc] ${addStatus?.type === 'error' ? 'border-[#da373c]' : addStatus?.type === 'success' ? 'border-[#23a559]' : 'border-transparent'}`}>
                  <input 
                    type="text" 
                    placeholder="You can add friends with their Discord username."
                    value={addInput}
                    onChange={(e) => setAddInput(e.target.value)}
                    className="flex-1 bg-transparent text-white outline-none px-2"
                  />
                  <button type="submit" disabled={!addInput} className="bg-[#5865F2] hover:bg-[#4752C4] disabled:opacity-50 text-white text-sm font-medium px-4 py-1.5 rounded transition">
                    Send Friend Request
                  </button>
                </form>
                {addStatus && (
                  <div className={`mt-2 text-sm ${addStatus.type === 'error' ? 'text-[#da373c]' : 'text-[#23a559]'}`}>
                    {addStatus.text}
                  </div>
                )}
              </div>
            )}

            {(tab === 'online' || tab === 'all') && (
              <div>
                <h2 className="text-[#b5bac1] text-xs font-bold uppercase mb-4">
                  {tab === 'online' ? 'Online' : 'All Friends'} — {tab === 'online' ? list.filter(u => u.status === 'online').length : list.length}
                </h2>
                <div className="space-y-1">
                  {list.filter(u => tab === 'all' || u.status === 'online').map(friend => (
                    <div key={friend.id} className="flex items-center justify-between p-3 hover:bg-[#3f4147] rounded-lg group cursor-pointer border-t border-[#3f4147] first:border-t-0">
                      <div className="flex items-center gap-3">
                        <div className="relative">
                          <img src={friend.avatar} alt="avatar" className="w-8 h-8 rounded-full" />
                          <div className={`absolute bottom-0 right-0 w-3 h-3 rounded-full border-2 border-[#313338] group-hover:border-[#3f4147] ${friend.status === 'online' ? 'bg-[#23a559]' : 'bg-[#80848e]'}`}></div>
                        </div>
                        <div className="flex flex-col">
                          <span className="text-white font-semibold flex items-center gap-1">
                            {friend.username}
                            {friend.isPremium && <Zap size={14} className="text-[#00a8fc] fill-[#00a8fc]" />}
                          </span>
                          <span className="text-xs text-[#b5bac1] capitalize">{friend.status}</span>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {tab === 'pending' && (
              <div>
                <h2 className="text-[#b5bac1] text-xs font-bold uppercase mb-4">Pending — {pendingList.length}</h2>
                <div className="space-y-1">
                  {pendingList.map(req => (
                    <div key={req.relationId} className="flex items-center justify-between p-3 hover:bg-[#3f4147] rounded-lg group cursor-pointer border-t border-[#3f4147] first:border-t-0">
                      <div className="flex items-center gap-3">
                         <img src={req.avatar} alt="avatar" className="w-8 h-8 rounded-full" />
                         <div className="flex flex-col">
                          <span className="text-white font-semibold">{req.username}</span>
                          <span className="text-xs text-[#b5bac1]">{req.type === 'incoming' ? 'Incoming Friend Request' : 'Outgoing Friend Request'}</span>
                        </div>
                      </div>
                      {req.type === 'incoming' && (
                        <div className="flex gap-2">
                          <button onClick={() => handleAcceptRequest(req.relationId)} className="w-9 h-9 flex items-center justify-center rounded-full bg-[#2b2d31] text-[#b5bac1] hover:text-[#23a559] hover:bg-[#1e1f22]">
                            <Check size={20} />
                          </button>
                          <button className="w-9 h-9 flex items-center justify-center rounded-full bg-[#2b2d31] text-[#b5bac1] hover:text-[#da373c] hover:bg-[#1e1f22]">
                            <X size={20} />
                          </button>
                        </div>
                      )}
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    function DMView() {
      const { currentUser, users, activeChat, messages, addMessage, activeCall, startCall, endCall, toggleAudio, toggleVideo, shareScreen, localStream, remoteStream, isAudioMuted, isVideoOff } = useContext(AppContext);
      const friend = users.find(u => u.id === activeChat);
      const [msgInput, setMsgInput] = useState('');
      const chatEndRef = useRef(null);

      useEffect(() => {
        chatEndRef.current?.scrollIntoView();
      }, [messages, activeChat]);

      if (!friend) return null;

      const chatMessages = messages.filter(m => 
        (m.senderId === currentUser.id && m.receiverId === friend.id) ||
        (m.senderId === friend.id && m.receiverId === currentUser.id)
      ).sort((a, b) => a.createdAt - b.createdAt);

      const handleSend = (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          if (!msgInput.trim()) return;
          addMessage({
            senderId: currentUser.id,
            receiverId: friend.id,
            text: msgInput.trim(),
            createdAt: Date.now()
          });
          setMsgInput('');
        }
      };

      return (
        <div className="flex flex-col h-full bg-[#313338]">
          {/* DM Header */}
          <div className="h-12 border-b border-[#1f2023] flex items-center justify-between px-4 shadow-sm shrink-0">
            <div className="flex items-center gap-3">
               <Hash size={24} className="text-[#80848e]" />
               <span className="font-semibold text-white flex items-center gap-2">
                 {friend.username}
                 {friend.isPremium && <Zap size={16} className="text-[#00a8fc] fill-[#00a8fc]" />}
               </span>
               <div className={`w-2.5 h-2.5 rounded-full ${friend.status === 'online' ? 'bg-[#23a559]' : 'bg-[#80848e]'}`}></div>
            </div>
            <div className="flex items-center gap-4 text-[#b5bac1]">
              <button onClick={() => startCall(friend.id, false)} className="hover:text-[#dbdee1]" title="Start Voice Call"><PhoneCall size={20} /></button>
              <button onClick={() => startCall(friend.id, true)} className="hover:text-[#dbdee1]" title="Start Video Call"><Video size={20} /></button>
            </div>
          </div>

          {activeCall && activeCall.partnerId === friend.id ? (
            <div className="flex-1 bg-[#1e1f22] flex flex-col relative p-4">
               {/* Video Grid */}
               <div className="flex-1 flex gap-4 mb-20">
                  <div className="flex-1 rounded-xl bg-black relative border-2 border-[#2b2d31] overflow-hidden">
                     <VideoPlayer stream={localStream} isLocal={true} />
                     <div className="absolute bottom-4 left-4 bg-black/70 px-3 py-1.5 rounded-md text-sm font-semibold flex items-center gap-2">
                        You {isAudioMuted && <MicOff size={14} className="text-[#da373c]" />}
                     </div>
                  </div>
                  <div className="flex-1 rounded-xl bg-black relative border-2 border-[#2b2d31] overflow-hidden flex items-center justify-center">
                     {remoteStream ? (
                         <VideoPlayer stream={remoteStream} isLocal={false} />
                     ) : (
                         <div className="w-full h-full flex flex-col items-center justify-center text-white gap-4 bg-[#111214]">
                            <img src={friend.avatar} alt="remote" className="w-24 h-24 rounded-full animate-pulse border-4 border-[#2b2d31]" />
                            <div className="font-medium text-lg text-[#b5bac1]">
                              {activeCall.status === 'calling' ? `Calling ${friend.username}...` : 'Connecting Streams...'}
                            </div>
                         </div>
                     )}
                     <div className="absolute bottom-4 left-4 bg-black/70 px-3 py-1.5 rounded-md text-sm font-semibold">{friend.username}</div>
                  </div>
               </div>

               {/* Call Controls */}
               <div className="absolute bottom-6 left-1/2 -translate-x-1/2 flex gap-4 bg-[#2b2d31] p-2.5 rounded-2xl shadow-xl">
                 <button onClick={toggleVideo} className={`w-14 h-14 rounded-full flex items-center justify-center text-white transition ${isVideoOff ? 'bg-[#da373c] hover:bg-[#c92b30]' : 'bg-[#313338] hover:bg-[#3f4147]'}`} title="Turn on/off camera">
                   {isVideoOff ? <VideoOff size={24}/> : <Video size={24}/>}
                 </button>
                 <button onClick={shareScreen} className="w-14 h-14 bg-[#313338] hover:bg-[#3f4147] rounded-full flex items-center justify-center text-white transition" title="Share Screen"><MonitorUp size={24}/></button>
                 <button onClick={toggleAudio} className={`w-14 h-14 rounded-full flex items-center justify-center text-white transition ${isAudioMuted ? 'bg-[#da373c] hover:bg-[#c92b30]' : 'bg-[#313338] hover:bg-[#3f4147]'}`} title="Mute/Unmute">
                   {isAudioMuted ? <MicOff size={24}/> : <Mic size={24}/>}
                 </button>
                 <button onClick={() => endCall(true)} className="w-14 h-14 bg-[#da373c] hover:bg-[#c92b30] rounded-full flex items-center justify-center text-white transition" title="Disconnect"><PhoneCall size={24} className="rotate-[135deg]"/></button>
               </div>
            </div>
          ) : (
            <>
              {/* Chat History */}
              <div className="flex-1 overflow-y-auto px-4 py-6 space-y-4 custom-scrollbar">
                <div className="flex flex-col justify-end min-h-full">
                  <div className="mb-8">
                    <img src={friend.avatar} alt="Avatar" className="w-20 h-20 rounded-full mb-4" />
                    <h1 className="text-3xl font-bold text-white mb-2 flex items-center gap-2">
                      {friend.username}
                      {friend.isPremium && <Zap size={24} className="text-[#00a8fc] fill-[#00a8fc]" />}
                    </h1>
                    <p className="text-[#b5bac1]">This is the beginning of your direct message history with <strong>{friend.username}</strong>.</p>
                  </div>

                  {chatMessages.map((msg, i) => {
                    const isMine = msg.senderId === currentUser.id;
                    const sender = isMine ? currentUser : friend;
                    const showHeader = i === 0 || chatMessages[i - 1].senderId !== msg.senderId || (msg.createdAt - chatMessages[i - 1].createdAt) > 300000;
                    
                    return (
                      <div key={msg.id} className={`flex gap-4 hover:bg-[#2e3035] p-0.5 -mx-4 px-4 rounded ${!showHeader ? 'mt-0' : 'mt-4'}`}>
                        {showHeader ? (
                          <img src={sender.avatar} className="w-10 h-10 rounded-full cursor-pointer hover:opacity-80" alt="avatar" />
                        ) : (
                          <div className="w-10 flex-shrink-0 text-right">
                             <span className="text-[10px] text-[#b5bac1] opacity-0 group-hover:opacity-100 hidden">
                               {new Date(msg.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
                             </span>
                          </div>
                        )}
                        <div className="flex flex-col min-w-0">
                          {showHeader && (
                            <div className="flex items-baseline gap-2">
                              <span className="text-white font-medium hover:underline cursor-pointer flex items-center gap-1">
                                {sender.username}
                                {sender.isPremium && <Zap size={14} className="text-[#00a8fc] fill-[#00a8fc]" />}
                              </span>
                              <span className="text-xs text-[#949ba4]">
                                {new Date(msg.createdAt).toLocaleString([], { dateStyle: 'short', timeStyle: 'short' })}
                              </span>
                            </div>
                          )}
                          <span className="text-[#dbdee1] whitespace-pre-wrap break-words">{msg.text}</span>
                        </div>
                      </div>
                    );
                  })}
                  <div ref={chatEndRef} />
                </div>
              </div>

              {/* Chat Input */}
              <div className="px-4 pb-6 pt-2 shrink-0">
                <div className="bg-[#383a40] rounded-lg flex items-center px-4 py-2.5">
                  <button className="text-[#b5bac1] hover:text-[#dbdee1] mr-4"><Plus size={24} className="bg-[#4e5058] rounded-full p-1" /></button>
                  <input 
                    type="text"
                    placeholder={`Message @${friend.username}`}
                    className="flex-1 bg-transparent text-[#dbdee1] outline-none placeholder-[#b5bac1]"
                    value={msgInput}
                    onChange={(e) => setMsgInput(e.target.value)}
                    onKeyDown={handleSend}
                  />
                  <div className="flex items-center gap-3 text-[#b5bac1] ml-4">
                    <button className="hover:text-[#dbdee1]"><ImageIcon size={24} /></button>
                    <button className="hover:text-[#dbdee1]"><Smile size={24} /></button>
                  </div>
                </div>
              </div>
            </>
          )}
        </div>
      );
    }

    // ---------------- SETTINGS MODAL ----------------

      const [activeTab, setActiveTab] = useState('profile');
      
      const handleOpenNewTab = () => {
        // Safely transfer document contents to a new window without file referencing
        const newWindow = window.open('', '_blank');
        if (newWindow) {
          newWindow.document.write(document.documentElement.outerHTML);
          newWindow.document.close();
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex bg-[#313338] text-white animate-in fade-in duration-200">
          {/* Sidebar */}
          <div className="w-[30%] bg-[#2b2d31] flex flex-col items-end py-14 px-4 overflow-y-auto custom-scrollbar">
            <div className="w-48 flex flex-col gap-1.5">
              <div className="text-xs font-bold text-[#b5bac1] px-2.5 pb-1 uppercase">User Settings</div>
              <TabButton active={activeTab === 'profile'} onClick={() => setActiveTab('profile')}>My Account</TabButton>
              <TabButton active={activeTab === 'profiles'} onClick={() => setActiveTab('profiles')}>Profiles</TabButton>
              <TabButton active={activeTab === 'nitro'} onClick={() => setActiveTab('nitro')}>Nitro</TabButton>
              
              {currentUser.username.toLowerCase() === 'wampus' && (

                     <ShieldAlert size={14} className="text-[#da373c]"/> Admin
                   </div>
                   <TabButton active={activeTab === 'admin'} onClick={() => setActiveTab('admin')} className="text-[#da373c] hover:bg-[#da373c]/10">Admin Panel</TabButton>
                 </>
              )}

              <TabButton onClick={onLogout} className="text-[#da373c] hover:bg-[#da373c]/10">Log Out</TabButton>

              {(activeTab !== 'profile' && activeTab !== 'profiles' && activeTab !== 'nitro' && activeTab !== 'admin') && (

            <div className="m-4 bg-[#2b2d31] rounded-lg p-4 space-y-4">

                  <div className="text-white">{currentUser.username}</div>

                <button className="bg-[#4e5058] hover:bg-[#6d6f78] text-white px-4 py-1.5 rounded font-medium transition text-sm">Edit</button>
              </div>
              <div className="flex justify-between items-center">
                <div>
                  <div className="text-xs font-bold text-[#b5bac1] uppercase mb-1">Email</div>
